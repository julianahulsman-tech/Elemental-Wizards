<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ice Mage Demo</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(180deg, #0d1f3c 0%, #060d1a 100%);
      color: #d6f4ff;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      border: 3px solid #7adcf5;
      background: #060d1a;
      box-shadow: 0 0 20px rgba(100, 210, 255, 0.3);
    }
    .help {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(122, 220, 245, 0.5);
    }
  </style>
</head>
<body>
  <div class="help">
    Press <strong>4</strong> or say <strong>"4"</strong> to fire an ice shard as Player 4.
  </div>
  <div style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; border:1px solid rgba(122,220,245,0.5); text-align:right;">
    <button type="button" onclick="handleAudioButton()" style="font-size:14px; padding:6px 12px;">Start Audio</button>
    <div id="status" style="margin-top:8px; font-size:13px; color:#b8eeff;">Audio model idle</div>
  </div>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div id="label-container" style="position:absolute; bottom:20px; left:20px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; border:1px solid rgba(122,220,245,0.5); min-width:220px; font-size:13px;">
    <div><strong>Audio labels</strong></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script>
    // ── Game setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mage = { x: canvas.width / 2 - 32, y: 80, width: 64, height: 96,
                   color: '#4db8d8', cloak: '#0d3a52' };
    const bullets = [];
    const snowflakes = Array.from({ length: 30 }, () => ({
      x: Math.random() * 640,
      y: Math.random() * 480,
      r: 1 + Math.random() * 2,
      speed: 0.3 + Math.random() * 0.5,
      drift: (Math.random() - 0.5) * 0.4
    }));
    let frameCount = 0;

    window.addEventListener('keydown', e => { if (e.key === '4') fireBullet(); });

    function fireBullet() {
      bullets.push({
        x: mage.x + mage.width / 2,
        y: mage.y + mage.height - 16,
        radius: 10,
        speed: 6,
        age: 0,
        angle: 0
      });
    }

    // Draw a snowflake / ice crystal shape
    function drawIceCrystal(x, y, size, angle, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#aaeeff';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        ctx.save();
        ctx.rotate((Math.PI / 3) * i);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -size);
        // Small branches
        ctx.moveTo(0, -size * 0.55);
        ctx.lineTo(size * 0.25, -size * 0.35);
        ctx.moveTo(0, -size * 0.55);
        ctx.lineTo(-size * 0.25, -size * 0.35);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawMage() {
      // Cloak
      ctx.fillStyle = mage.cloak;
      ctx.fillRect(mage.x, mage.y + 24, mage.width, mage.height - 24);

      // Frost trim on cloak
      ctx.strokeStyle = 'rgba(180,240,255,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(mage.x, mage.y + 24, mage.width, mage.height - 24);

      // Head
      ctx.fillStyle = mage.color;
      ctx.fillRect(mage.x + 14, mage.y, 36, 36);

      // Staff (icy crystal blue)
      ctx.fillStyle = '#5cc8e8';
      ctx.fillRect(mage.x + mage.width + 6, mage.y + 14, 7, 80);

      // Staff crystal orb
      const orbGrad = ctx.createRadialGradient(
        mage.x + mage.width + 10, mage.y + 12, 1,
        mage.x + mage.width + 10, mage.y + 12, 13
      );
      orbGrad.addColorStop(0, '#ffffff');
      orbGrad.addColorStop(0.35, '#a0eeff');
      orbGrad.addColorStop(0.7, '#2090b8');
      orbGrad.addColorStop(1, 'rgba(0,80,140,0)');
      ctx.beginPath();
      ctx.arc(mage.x + mage.width + 10, mage.y + 12, 13, 0, Math.PI * 2);
      ctx.fillStyle = orbGrad;
      ctx.fill();

      // Tiny ice crystal on staff orb
      drawIceCrystal(mage.x + mage.width + 10, mage.y + 12, 8, frameCount * 0.02, 0.7);

      // Snowflake symbol on cloak
      ctx.fillStyle = '#c8f0ff';
      ctx.font = '22px sans-serif';
      ctx.fillText('❄', mage.x + mage.width / 2 - 10, mage.y + 60);

      // Hat
      ctx.fillStyle = '#062840';
      ctx.beginPath();
      ctx.moveTo(mage.x + 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width - 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width / 2, mage.y - 18);
      ctx.closePath();
      ctx.fill();

      // Hat rim frost highlight
      ctx.strokeStyle = 'rgba(160,230,255,0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(mage.x + 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width - 10, mage.y + 8);
      ctx.stroke();
    }

    function drawBullets() {
      bullets.forEach(b => {
        b.angle += 0.15;

        // Outer frost glow
        const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 2.5);
        glow.addColorStop(0, 'rgba(180,240,255,0.5)');
        glow.addColorStop(0.5, 'rgba(80,190,240,0.2)');
        glow.addColorStop(1, 'rgba(0,120,200,0)');
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // Core shard
        const core = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
        core.addColorStop(0, '#ffffff');
        core.addColorStop(0.4, '#80e0ff');
        core.addColorStop(1, '#0080b8');
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = core;
        ctx.fill();

        // Spinning ice crystal overlay
        drawIceCrystal(b.x, b.y, b.radius + 4, b.angle, 0.85);
      });
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        bullets[i].age++;
        if (bullets[i].y + bullets[i].radius < 0) bullets.splice(i, 1);
      }
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#0a1a30');
      g.addColorStop(1, '#040a14');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Faint concentric frost rings
      ctx.strokeStyle = 'rgba(120,210,240,0.12)';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(canvas.width / 2, 240 + i * 16, 155 - i * 16, 0, Math.PI, true);
        ctx.stroke();
      }

      // Falling snowflakes
      ctx.save();
      snowflakes.forEach(s => {
        s.y += s.speed;
        s.x += s.drift;
        if (s.y > canvas.height) { s.y = -4; s.x = Math.random() * canvas.width; }
        if (s.x > canvas.width) s.x = 0;
        if (s.x < 0) s.x = canvas.width;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(200,240,255,0.55)';
        ctx.fill();
      });
      ctx.restore();

      // Ground frost glow
      const frostGrad = ctx.createLinearGradient(0, canvas.height - 30, 0, canvas.height);
      frostGrad.addColorStop(0, 'rgba(80,200,240,0.04)');
      frostGrad.addColorStop(1, 'rgba(180,240,255,0.12)');
      ctx.fillStyle = frostGrad;
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
    }

    function loop() {
      frameCount++;
      updateBullets();
      drawBackground();
      drawMage();
      drawBullets();
      requestAnimationFrame(loop);
    }
    loop();

    // ── Audio / Teachable Machine ────────────────────────────────────────────
    // Replace MODEL_URL with your own Teachable Machine audio model for "4"
    const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/dQJy5AP3m/';
    let recognizer = null;
    let classLabels = [];
    let audioPaused = false;
    let browserSpeech = null;
    const status = document.getElementById('status');
    const labelContainer = document.getElementById('label-container');

    async function createModel() {
      const r = speechCommands.create(
        'BROWSER_FFT', undefined,
        MODEL_URL + 'model.json',
        MODEL_URL + 'metadata.json'
      );
      await r.ensureModelLoaded();
      return r;
    }

    function startListeningTF() {
      recognizer.listen(result => {
        const scores = result.scores;
        for (let i = 0; i < classLabels.length; i++) {
          labelContainer.childNodes[i + 1].innerHTML = classLabels[i] + ': ' + scores[i].toFixed(2);
        }
        const best = scores.indexOf(Math.max(...scores));
        const label = classLabels[best];
        status.textContent = label + ': ' + scores[best].toFixed(2);
        const isNoise = /background|noise|unknown/i.test(label);
        if (scores[best] >= 0.75 && !isNoise) {
          fireBullet();
        }
      }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.75,
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.50
      });
    }

    function startBrowserSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return false;
      browserSpeech = new SR();
      browserSpeech.lang = 'en-US';
      browserSpeech.continuous = true;
      browserSpeech.interimResults = false;

      browserSpeech.onresult = e => {
        const t = e.results[e.results.length - 1][0].transcript.trim().toLowerCase().replace(/(\d)/g," $1 ").replace(/\s+/g," ").trim();
        if (/\bpause\b/.test(t)) { pauseAudio(); return; }
        status.textContent = 'Heard: "' + t + '"';
        const shots=(t.match(/\b(4|four|for|fore|ice|freeze|frost|chill)\b/g)||[]).length;
        for(let i=0;i<shots;i++) fireBullet();
        if(shots>0) status.textContent='Fired '+shots+'x! (heard: "'+t+'")';
      };
      browserSpeech.onerror = e => { if (e.error !== 'no-speech') status.textContent = 'Error: ' + e.error; };
      browserSpeech.onend = () => { if (!audioPaused) try { browserSpeech.start(); } catch(e) {} };
      browserSpeech.start();
      return true;
    }

    function pauseAudio() {
      audioPaused = true;
      if (recognizer) recognizer.stopListening();
      if (browserSpeech) browserSpeech.stop();
      status.textContent = 'Audio paused — click Start Audio to resume';
    }

    function init() {
      audioPaused = false;
      if (startBrowserSpeech()) {
        status.textContent = 'Voice recognition active — say "four" to fire';
      } else {
        status.textContent = 'Audio unavailable — use keyboard (press 4)';
      }
    }

    function handleAudioButton() {
      if (audioPaused) {
        audioPaused = false;
        if (browserSpeech) { try { browserSpeech.start(); } catch(ex) {} status.textContent = 'Listening...'; }
        else { init(); }
      } else {
        init();
      }
    }
  </script>
</body>
</html>
