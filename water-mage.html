<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Mage Demo</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(180deg, #0b3d91 0%, #0a1d3c 100%);
      color: #e0f7ff;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      border: 3px solid #70c1f2;
      background: #12253f;
      box-shadow: 0 0 20px rgba(0, 120, 255, 0.3);
    }
    .help {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(112, 193, 242, 0.5);
    }
  </style>
</head>
<body>
  <div class="help">
    Press <strong>1</strong> or say <strong>"1"</strong> to fire a water ball as Player 1.
  </div>
  <div style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; border:1px solid rgba(112,193,242,0.5); text-align:right;">
    <button type="button" onclick="handleAudioButton()" style="font-size:14px; padding:6px 12px;">Start Audio</button>
    <div id="status" style="margin-top:8px; font-size:13px; color:#c7ecff;">Audio model idle</div>
  </div>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div id="label-container" style="position:absolute; bottom:20px; left:20px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; border:1px solid rgba(112,193,242,0.5); min-width:220px; font-size:13px;">
    <div><strong>Audio labels</strong></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script>
    // ── Game setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mage = { x: canvas.width / 2 - 32, y: 80, width: 64, height: 96,
                   color: '#5db8ff', cloak: '#113f85' };
    const bullets = [];

    window.addEventListener('keydown', e => { if (e.key === '1') fireBullet(); });

    function fireBullet() {
      bullets.push({ x: mage.x + mage.width / 2, y: mage.y + mage.height - 16, radius: 10, speed: 5 });
    }

    function drawMage() {
      ctx.fillStyle = mage.cloak;
      ctx.fillRect(mage.x, mage.y + 24, mage.width, mage.height - 24);
      ctx.fillStyle = mage.color;
      ctx.fillRect(mage.x + 14, mage.y, 36, 36);
      ctx.fillStyle = '#d2f1ff';
      ctx.fillRect(mage.x + mage.width + 6, mage.y + 14, 8, 80);
      ctx.beginPath();
      ctx.arc(mage.x + mage.width + 10, mage.y + 14, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#8ee3ff';
      ctx.fill();
      ctx.fillStyle = '#bbdefb';
      ctx.font = '24px sans-serif';
      ctx.fillText('~', mage.x + mage.width / 2 - 8, mage.y + 56);
      ctx.fillStyle = '#0f6086';
      ctx.beginPath();
      ctx.moveTo(mage.x + 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width - 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width / 2, mage.y - 18);
      ctx.closePath();
      ctx.fill();
    }

    function drawBullets() {
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(135,206,250,0.9)';
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(b.x - 2, b.y - 2, b.radius / 3, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        if (bullets[i].y + bullets[i].radius < 0) bullets.splice(i, 1);
      }
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#0b2b57');
      g.addColorStop(1, '#081723');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(105,183,255,0.3)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.arc(canvas.width / 2, 220 + i * 18, 170 - i * 16, 0, Math.PI, true);
        ctx.stroke();
      }
    }

    function loop() { updateBullets(); drawBackground(); drawMage(); drawBullets(); requestAnimationFrame(loop); }
    loop();

    // ── Audio / Teachable Machine ────────────────────────────────────────────
    const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/dQJy5AP3m/';
    let recognizer = null;
    let classLabels = [];
    let audioPaused = false;
    let browserSpeech = null;
    const status = document.getElementById('status');
    const labelContainer = document.getElementById('label-container');

    async function createModel() {
      const r = speechCommands.create(
        'BROWSER_FFT', undefined,
        MODEL_URL + 'model.json',
        MODEL_URL + 'metadata.json'
      );
      await r.ensureModelLoaded();
      return r;
    }

    function startListeningTF() {
      recognizer.listen(result => {
        const scores = result.scores;
        for (let i = 0; i < classLabels.length; i++) {
          labelContainer.childNodes[i + 1].innerHTML = classLabels[i] + ': ' + scores[i].toFixed(2);
        }
        const best = scores.indexOf(Math.max(...scores));
        const label = classLabels[best];
        status.textContent = label + ': ' + scores[best].toFixed(2);
        const isNoise = /background|noise|unknown/i.test(label);
        if (scores[best] >= 0.75 && !isNoise) {
          fireBullet();
        }
      }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.75,
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.50
      });
    }

    function startBrowserSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return false;
      browserSpeech = new SR();
      browserSpeech.lang = 'en-US';
      browserSpeech.continuous = true;
      browserSpeech.interimResults = false;

      browserSpeech.onresult = e => {
        const t = e.results[e.results.length - 1][0].transcript.trim().toLowerCase().replace(/(\d)/g," $1 ").replace(/\s+/g," ").trim();
        if (/\bpause\b/.test(t)) { pauseAudio(); return; }
        status.textContent = 'Heard: "' + t + '"';
        const shots=(t.match(/\b(1|one|won|wun|fire|go)\b/g)||[]).length;
        for(let i=0;i<shots;i++) fireBullet();
        if(shots>0) status.textContent='Fired '+shots+'x! (heard: "'+t+'")';
      };
      browserSpeech.onerror = e => { if (e.error !== 'no-speech') status.textContent = 'Error: ' + e.error; };
      browserSpeech.onend = () => { if (!audioPaused) try { browserSpeech.start(); } catch(e) {} };
      browserSpeech.start();
      return true;
    }

    function pauseAudio() {
      audioPaused = true;
      if (recognizer) recognizer.stopListening();
      if (browserSpeech) browserSpeech.stop();
      status.textContent = 'Audio paused — click Start Audio to resume';
    }

    function init() {
      audioPaused = false;
      if (startBrowserSpeech()) {
        status.textContent = 'Voice recognition active — say "one" to fire';
      } else {
        status.textContent = 'Audio unavailable — use keyboard (press 1)';
      }
    }

    function handleAudioButton() {
      if (audioPaused) {
        audioPaused = false;
        if (browserSpeech) { try { browserSpeech.start(); } catch(ex) {} status.textContent = 'Listening...'; }
        else { init(); }
      } else {
        init();
      }
    }
  </script>
</body>
</html>
