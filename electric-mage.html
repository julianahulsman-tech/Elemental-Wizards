<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electric Mage Demo</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(180deg, #1a0d3d 0%, #0a0618 100%);
      color: #e8d9ff;
      font-family: Arial, sans-serif;
    }
    #gameCanvas {
      border: 3px solid #b06aff;
      background: #0a0618;
      box-shadow: 0 0 20px rgba(160, 80, 255, 0.4);
    }
    .help {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(176, 106, 255, 0.5);
    }
  </style>
</head>
<body>
  <div class="help">
    Press <strong>3</strong> or say <strong>"3"</strong> to fire a lightning bolt as Player 3.
  </div>
  <div style="position:absolute; top:20px; right:20px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; border:1px solid rgba(176,106,255,0.5); text-align:right;">
    <button type="button" onclick="handleAudioButton()" style="font-size:14px; padding:6px 12px;">Start Audio</button>
    <div id="status" style="margin-top:8px; font-size:13px; color:#ddc8ff;">Audio model idle</div>
  </div>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div id="label-container" style="position:absolute; bottom:20px; left:20px; background:rgba(0,0,0,0.45); padding:10px 12px; border-radius:8px; border:1px solid rgba(176,106,255,0.5); min-width:220px; font-size:13px;">
    <div><strong>Audio labels</strong></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
  <script>
    // ── Game setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mage = { x: canvas.width / 2 - 32, y: 80, width: 64, height: 96,
                   color: '#7b2fff', cloak: '#2d0a6b' };
    const bullets = [];
    let frameCount = 0;

    window.addEventListener('keydown', e => { if (e.key === '3') fireBullet(); });

    function fireBullet() {
      bullets.push({
        x: mage.x + mage.width / 2,
        y: mage.y + mage.height - 16,
        radius: 10,
        speed: 6,
        age: 0,
        jitter: []
      });
    }

    // Generate a jagged lightning path between two points
    function lightningPath(x1, y1, x2, y2, segments) {
      const points = [{ x: x1, y: y1 }];
      for (let i = 1; i < segments; i++) {
        const t = i / segments;
        const mx = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 14;
        const my = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 14;
        points.push({ x: mx, y: my });
      }
      points.push({ x: x2, y: y2 });
      return points;
    }

    function drawMage() {
      // Cloak
      ctx.fillStyle = mage.cloak;
      ctx.fillRect(mage.x, mage.y + 24, mage.width, mage.height - 24);

      // Head
      ctx.fillStyle = mage.color;
      ctx.fillRect(mage.x + 14, mage.y, 36, 36);

      // Staff
      ctx.fillStyle = '#8860c0';
      ctx.fillRect(mage.x + mage.width + 6, mage.y + 14, 8, 80);

      // Staff orb — electric glow
      const orbGrad = ctx.createRadialGradient(
        mage.x + mage.width + 10, mage.y + 14, 1,
        mage.x + mage.width + 10, mage.y + 14, 13
      );
      orbGrad.addColorStop(0, '#ffffff');
      orbGrad.addColorStop(0.3, '#c8aaff');
      orbGrad.addColorStop(0.7, '#8833ff');
      orbGrad.addColorStop(1, 'rgba(80,0,200,0)');
      ctx.beginPath();
      ctx.arc(mage.x + mage.width + 10, mage.y + 14, 13, 0, Math.PI * 2);
      ctx.fillStyle = orbGrad;
      ctx.fill();

      // Small arc sparks on staff orb
      if (frameCount % 4 === 0) {
        const ox = mage.x + mage.width + 10;
        const oy = mage.y + 14;
        const pts = lightningPath(ox - 10, oy, ox + 10, oy, 5);
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        pts.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.strokeStyle = 'rgba(220,180,255,0.8)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Lightning symbol on cloak
      ctx.fillStyle = '#ffe066';
      ctx.font = '22px sans-serif';
      ctx.fillText('⚡', mage.x + mage.width / 2 - 10, mage.y + 60);

      // Hat
      ctx.fillStyle = '#1a0540';
      ctx.beginPath();
      ctx.moveTo(mage.x + 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width - 10, mage.y + 8);
      ctx.lineTo(mage.x + mage.width / 2, mage.y - 18);
      ctx.closePath();
      ctx.fill();
    }

    function drawBullets() {
      bullets.forEach(b => {
        // Outer glow
        const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 2.8);
        glow.addColorStop(0, 'rgba(200,160,255,0.5)');
        glow.addColorStop(0.5, 'rgba(130,60,255,0.25)');
        glow.addColorStop(1, 'rgba(80,0,200,0)');
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius * 2.8, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();

        // Core orb
        const core = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
        core.addColorStop(0, '#ffffff');
        core.addColorStop(0.4, '#c080ff');
        core.addColorStop(1, '#6600cc');
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = core;
        ctx.fill();

        // Trailing lightning sparks
        if (b.age % 2 === 0) {
          for (let s = 0; s < 2; s++) {
            const pts = lightningPath(
              b.x + (Math.random() - 0.5) * 6,
              b.y + b.radius,
              b.x + (Math.random() - 0.5) * 20,
              b.y + b.radius + 12 + Math.random() * 8,
              4
            );
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = 'rgba(200,160,255,0.7)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
        }
      });
    }

    function updateBullets() {
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y -= bullets[i].speed;
        bullets[i].age++;
        if (bullets[i].y + bullets[i].radius < 0) bullets.splice(i, 1);
      }
    }

    function drawBackground() {
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, '#130828');
      g.addColorStop(1, '#060210');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant storm cloud flickers
      if (frameCount % 30 === 0) {
        ctx.fillStyle = 'rgba(180,120,255,0.04)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Background arc arcs
      for (let i = 0; i < 5; i++) {
        const alpha = 0.06 + 0.04 * Math.sin(frameCount * 0.04 + i * 1.2);
        ctx.strokeStyle = `rgba(160,80,255,${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(canvas.width / 2, 260 + i * 20, 160 - i * 18, 0, Math.PI, true);
        ctx.stroke();
      }

      // Floating static sparks
      ctx.save();
      for (let i = 0; i < 10; i++) {
        const x = (Math.sin(i * 2.1 + frameCount * 0.015) * 120 + canvas.width / 2 + (i - 5) * 45) % canvas.width;
        const y = (frameCount * 0.3 + i * 53) % canvas.height;
        const alpha = 0.1 + 0.1 * Math.sin(frameCount * 0.08 + i);
        ctx.fillStyle = `rgba(200,160,255,${alpha})`;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.restore();
    }

    function loop() {
      frameCount++;
      updateBullets();
      drawBackground();
      drawMage();
      drawBullets();
      requestAnimationFrame(loop);
    }
    loop();

    // ── Audio / Teachable Machine ────────────────────────────────────────────
    // Replace MODEL_URL with your own Teachable Machine audio model for "3"
    const MODEL_URL = 'https://teachablemachine.withgoogle.com/models/dQJy5AP3m/';
    let recognizer = null;
    let classLabels = [];
    let audioPaused = false;
    let browserSpeech = null;
    const status = document.getElementById('status');
    const labelContainer = document.getElementById('label-container');

    async function createModel() {
      const r = speechCommands.create(
        'BROWSER_FFT', undefined,
        MODEL_URL + 'model.json',
        MODEL_URL + 'metadata.json'
      );
      await r.ensureModelLoaded();
      return r;
    }

    function startListeningTF() {
      recognizer.listen(result => {
        const scores = result.scores;
        for (let i = 0; i < classLabels.length; i++) {
          labelContainer.childNodes[i + 1].innerHTML = classLabels[i] + ': ' + scores[i].toFixed(2);
        }
        const best = scores.indexOf(Math.max(...scores));
        const label = classLabels[best];
        status.textContent = label + ': ' + scores[best].toFixed(2);
        const isNoise = /background|noise|unknown/i.test(label);
        if (scores[best] >= 0.75 && !isNoise) {
          fireBullet();
        }
      }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.75,
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.50
      });
    }

    function startBrowserSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return false;
      browserSpeech = new SR();
      browserSpeech.lang = 'en-US';
      browserSpeech.continuous = true;
      browserSpeech.interimResults = false;

      browserSpeech.onresult = e => {
        const t = e.results[e.results.length - 1][0].transcript.trim().toLowerCase().replace(/(\d)/g," $1 ").replace(/\s+/g," ").trim();
        if (/\bpause\b/.test(t)) { pauseAudio(); return; }
        status.textContent = 'Heard: "' + t + '"';
        const shots=(t.match(/\b(3|three|zap|shock|thunder|bolt)\b/g)||[]).length;
        for(let i=0;i<shots;i++) fireBullet();
        if(shots>0) status.textContent='Fired '+shots+'x! (heard: "'+t+'")';
      };
      browserSpeech.onerror = e => { if (e.error !== 'no-speech') status.textContent = 'Error: ' + e.error; };
      browserSpeech.onend = () => { if (!audioPaused) try { browserSpeech.start(); } catch(e) {} };
      browserSpeech.start();
      return true;
    }

    function pauseAudio() {
      audioPaused = true;
      if (recognizer) recognizer.stopListening();
      if (browserSpeech) browserSpeech.stop();
      status.textContent = 'Audio paused — click Start Audio to resume';
    }

    function init() {
      audioPaused = false;
      if (startBrowserSpeech()) {
        status.textContent = 'Voice recognition active — say "three" to fire';
      } else {
        status.textContent = 'Audio unavailable — use keyboard (press 3)';
      }
    }

    function handleAudioButton() {
      if (audioPaused) {
        audioPaused = false;
        if (browserSpeech) { try { browserSpeech.start(); } catch(ex) {} status.textContent = 'Listening...'; }
        else { init(); }
      } else {
        init();
      }
    }
  </script>
</body>
</html>
