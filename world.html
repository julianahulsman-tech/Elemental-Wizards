  fireDmg:[3,12],waterDmg:[3,12],iceDmg:[3,12],elecDmg:[3,12]};
let _rngSeq=0;
function rr(mn,mx){return+(mn+Math.random()*(mx-mn)).toFixed(1);}
function generateEquip(bk,elemNum,rarOvr){
  const bd=EQUIP_BASES[bk];if(!bd)return null;
  const r0=Math.random();
  const rar=rarOvr||(r0<0.55?'normal':r0<0.85?'magic':'rare');
  const[mnA,mxA]=RARITY_AFF[rar],nAff=mnA+Math.floor(Math.random()*(mxA-mnA+1));
  const stats={};
  const bdef=bk==='wand'&&elemNum?[{s:{1:'waterDmg',2:'fireDmg',3:'elecDmg',4:'iceDmg'}[elemNum]||'fireDmg',mn:8,mx:28}]:[...bd.base];
  bdef.forEach(b=>{stats[b.s]=rr(b.mn,b.mx);});
  const pool=[...bd.affixes];
  for(let i=0;i<nAff&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);const aff=pool.splice(idx,1)[0];
    if(!stats[aff]){const[mn2,mx2]=AFFIX_RNG[aff]||[1,5];stats[aff]=rr(mn2,mx2);}
  }
  const gs=bd.gemSlots||0;
  return{_id:'rng'+(++_rngSeq),baseType:bk,name:RARITY_NAMES[rar]+bd.name,icon:bd.icon,
    slots:bd.slots,rarity:rar,stats,desc:'',gemSlots:gs,gems:Array(gs).fill(null),cost:0};
}

function h1(c,r){return(((c+_mapSeed)*7+(r+_mapSeed)*13)*2654435761>>>0)%100;}
function h2(c,r){return(((c+_mapSeed*3)*11+(r+_mapSeed*2)*17)*1234567891>>>0)%100;}
function hF(c,r){return(((c+_mapSeed)*31+(r+_mapSeed)*19)*987654321>>>0)%4;}
function hFl(c,r){return(((c+_mapSeed*5)*23+(r+_mapSeed*4)*29)*741852963>>>0)%100;}

function clearMap(base){for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)map[r][c]=base;}

function buildTownMap(){
  clearMap(T.GRASS);

  // Dense forest border around the whole map
  for(let r=0;r<MH;r++) for(let c=0;c<MW;c++){
    if(r<4||r>59||c<4||c>59) map[r][c]=T.TREE;
    else if((r<6||r>57||c<6||c>57)&&h1(c,r)%100<75) map[r][c]=T.TREE;
  }

  // NE district — garden with pond (cols 37-59, rows 5-27)
  for(let r=5;r<27;r++) for(let c=37;c<59;c++){
    if(h2(c,r)%100<38) map[r][c]=T.TREE;
    if(map[r][c]===T.GRASS&&hFl(c,r)%100<25) map[r][c]=T.FLOWER_R+(hFl(c,r)%3);
  }
  // Pond in garden
  for(let r=8;r<23;r++) for(let c=43;c<57;c++){
    const d=(c-50)*(c-50)/22+(r-15)*(r-15)/16;
    if(d<0.5) map[r][c]=T.DEEP_WATER;
    else if(d<1.0) map[r][c]=T.WATER;
  }

  // NW district — residential (cols 5-27, rows 5-27)
  for(let r=5;r<27;r++) for(let c=5;c<27;c++){
    if(h1(c+1,r+2)%100<28) map[r][c]=T.TREE;
    if(map[r][c]===T.GRASS&&hFl(c+3,r)%100<14) map[r][c]=T.FLOWER_R+(hFl(c,r)%3);
  }

  // SE district — open meadows/fields (cols 37-59, rows 35-58)
  for(let r=35;r<58;r++) for(let c=37;c<59;c++){
    if(h2(c+3,r+1)%100<18) map[r][c]=T.TREE;
    if(map[r][c]===T.GRASS&&hFl(c,r+2)%100<30) map[r][c]=T.FLOWER_R+(hFl(c+1,r)%3);
  }

  // SW district — scattered houses/gardens (cols 5-27, rows 35-58)
  for(let r=35;r<58;r++) for(let c=5;c<27;c++){
    if(h1(c,r+5)%100<20) map[r][c]=T.TREE;
    if(map[r][c]===T.GRASS&&hFl(c+2,r+3)%100<16) map[r][c]=T.FLOWER_R+(hFl(c,r)%3);
  }

  // ── Main cobblestone cross roads ──
  for(let r=4;r<60;r++){
    map[r][28]=T.COBBLE;map[r][29]=T.COBBLE;map[r][30]=T.COBBLE;
    map[r][31]=T.COBBLE;map[r][32]=T.COBBLE;map[r][33]=T.COBBLE;
  }
  for(let c=4;c<60;c++){
    map[28][c]=T.COBBLE;map[29][c]=T.COBBLE;map[30][c]=T.COBBLE;
    map[31][c]=T.COBBLE;map[32][c]=T.COBBLE;map[33][c]=T.COBBLE;
  }

  // ── Town square — wide plaza around road intersection ──
  for(let r=23;r<39;r++) for(let c=23;c<39;c++) map[r][c]=T.COBBLE;

  // ── Tower grounds — north plaza ──
  for(let r=5;r<22;r++) for(let c=25;c<37;c++) map[r][c]=T.COBBLE;
  // ── Tower courtyard — NE corner ──
  for(let r=5;r<17;r++) for(let c=38;c<50;c++) map[r][c]=T.COBBLE;

  // ── Secondary dirt roads ──
  for(let c=5;c<59;c++){
    if(TILE_DEF[map[17][c]].w&&map[17][c]!==T.COBBLE) map[17][c]=T.DIRT;
    if(TILE_DEF[map[18][c]].w&&map[18][c]!==T.COBBLE) map[18][c]=T.DIRT;
    if(TILE_DEF[map[44][c]].w&&map[44][c]!==T.COBBLE) map[44][c]=T.DIRT;
    if(TILE_DEF[map[45][c]].w&&map[45][c]!==T.COBBLE) map[45][c]=T.DIRT;
  }
  for(let r=5;r<59;r++){
    if(TILE_DEF[map[r][17]].w&&map[r][17]!==T.COBBLE) map[r][17]=T.DIRT;
    if(TILE_DEF[map[r][18]].w&&map[r][18]!==T.COBBLE) map[r][18]=T.DIRT;
    if(TILE_DEF[map[r][44]].w&&map[r][44]!==T.COBBLE) map[r][44]=T.DIRT;
    if(TILE_DEF[map[r][45]].w&&map[r][45]!==T.COBBLE) map[r][45]=T.DIRT;
  }

  // ── Market cobblestone patches west of square ──
  for(let r=19;r<28;r++) for(let c=6;c<23;c++)
    if(TILE_DEF[map[r][c]].w&&h2(c,r)%100<55) map[r][c]=T.COBBLE;

  // ── South entry road from beach ──
  for(let r=50;r<60;r++){
    map[r][28]=T.SAND;map[r][29]=T.SAND;map[r][30]=T.SAND;
    map[r][31]=T.SAND;map[r][32]=T.SAND;map[r][33]=T.SAND;
  }
}

function buildBeachMap(){
  clearMap(T.SAND);
  // Ocean on the west side
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
    if(c<6)map[r][c]=T.DEEP_WATER;
    else if(c<13)map[r][c]=T.WATER;
  }
  // Rocky shore patches
  for(let r=0;r<MH;r++)for(let c=11;c<18;c++)
    if(h1(c,r+4)%100<14)map[r][c]=T.ROCK;
  // Inland grass starting around col 30
  for(let r=0;r<MH;r++)for(let c=30;c<MW;c++){
    if(h2(c,r)%100<40)map[r][c]=T.GRASS;
    if(map[r][c]===T.GRASS&&h1(c+2,r+1)%100<55)map[r][c]=T.TREE;
  }
  // Mixed sand/grass transition zone
  for(let r=0;r<MH;r++)for(let c=22;c<32;c++)
    if(map[r][c]===T.SAND&&h2(c+1,r+3)%100<28)map[r][c]=T.GRASS;
  // Flowers in grass
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(map[r][c]===T.GRASS&&hFl(c,r)%100<10)map[r][c]=T.FLOWER_R+(hFl(c,r)%3);
  // Main east path (rows 29-33) — cleared through all terrain
  for(let c=12;c<MW;c++){
    map[29][c]=T.SAND;map[30][c]=T.DIRT;map[31][c]=T.DIRT;map[32][c]=T.DIRT;map[33][c]=T.SAND;
  }
  // Spawn clearing (where player wakes up)
  for(let r=27;r<36;r++)for(let c=12;c<23;c++)
    if(map[r][c]!==T.WATER&&map[r][c]!==T.DEEP_WATER)map[r][c]=T.SAND;
  // Boss/gate clearing at east end
  for(let r=26;r<37;r++)for(let c=54;c<MW;c++)
    if(map[r][c]===T.TREE||map[r][c]===T.ROCK)map[r][c]=T.GRASS;
}

function buildStormMap(){
  clearMap(T.SPARK_GROUND);
  // Rocky peaks
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(h2(c,r)%100<32)map[r][c]=T.ROCK;
  // Tall spires (dark rock clusters)
  [[10,8],[20,20],[40,12],[55,8],[15,40],[48,30],[30,5],[5,50]].forEach(([cx,cr])=>{
    for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){
      const d=(c-cx)*(c-cx)/16+(r-cr)*(r-cr)/12;
      if(d<1.0)map[r][c]=T.ROCK;
    }
  });
  // Clear paths
  for(let r=0;r<MH;r++){map[r][30]=T.SPARK_GROUND;map[r][31]=T.SPARK_GROUND;map[r][32]=T.SPARK_GROUND;}
  for(let c=0;c<MW;c++){map[20][c]=T.SPARK_GROUND;map[21][c]=T.SPARK_GROUND;}
  for(let r=48;r<MH;r++)for(let c=22;c<42;c++)map[r][c]=T.SPARK_GROUND;
}

function buildForestMap(){
  clearMap(T.GRASS);
  // Dense trees
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(h1(c,r)%100<68)map[r][c]=T.TREE;
  // Flowers in clearings
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(map[r][c]===T.GRASS&&hFl(c,r)%100<20)map[r][c]=T.FLOWER_R+(hFl(c,r)%3);
  // Clear main paths
  for(let r=0;r<MH;r++){map[r][30]=T.DIRT;map[r][31]=T.DIRT;map[r][32]=T.DIRT;}
  for(let c=0;c<MW;c++){map[15][c]=T.DIRT;map[16][c]=T.DIRT;}
  for(let c=0;c<MW;c++){map[35][c]=T.DIRT;map[36][c]=T.DIRT;}
  for(let r=48;r<MH;r++)for(let c=22;c<42;c++)
    if(map[r][c]===T.TREE)map[r][c]=T.GRASS;
}

function buildEmberMap(){
  clearMap(T.GRASS);
  // Lava everywhere
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(hF(c,r)<=1)map[r][c]=T.LAVA_ROCK;
  // Rocky obstacles
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(map[r][c]===T.GRASS&&h2(c+5,r)%100<22)map[r][c]=T.ROCK;
  // Lava rivers (diagonal strips)
  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if((c+r)%12<3)map[r][c]=T.LAVA_ROCK;
  // Paths
  for(let r=0;r<MH;r++){map[r][30]=T.LAVA_ROCK;map[r][31]=T.LAVA_ROCK;map[r][32]=T.LAVA_ROCK;}
  for(let c=0;c<MW;c++){map[20][c]=T.LAVA_ROCK;map[21][c]=T.LAVA_ROCK;}
  for(let r=48;r<MH;r++)for(let c=22;c<42;c++)
    if(map[r][c]===T.ROCK)map[r][c]=T.LAVA_ROCK;
}

function buildTundraMap(){
  clearMap(T.SNOW);

  for(let r=0;r<MH;r++)for(let c=0;c<MW;c++)
    if(h2(c,r)%100<28)map[r][c]=T.ICE_ROCK;
  // Frozen ponds
  [[12,15],[40,20],[25,40],[50,45],[8,50]].forEach(([cx,cr])=>{
    for(let r=0;r<MH;r++)for(let c=0;c<MW;c++){

function buildSTData(){
  const nodes=[],edges=[];
  function nd(id,lbl,stat,val,x,y,tier){nodes.push({id,lbl,stat,val,x,y,tier});}
  function eg(a,b){edges.push([a,b]);}
  function sat(pid,cx,cy,stat,val,count,r,aOff){
    for(let i=0;i<count;i++){
      const a=aOff+(i/count)*Math.PI*2;
      const id=pid+'s'+i;
      nd(id,STAT_SHORT[stat]||stat,stat,val,Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),0);
      eg(pid,id);if(i>0)eg(pid+'s'+(i-1),id);
    }
    if(count>2)eg(pid+'s'+(count-1),pid+'s0');
  }
  // ── Water sector (left, element 1) ──────────────────────────────────────
  nd('w_ks','Tide Lord',   'waterDmg',15, 220,800, 2);
  nd('w_n1','Flood',       'waterDmg', 8, 375,660, 1);
  nd('w_n2','Current',     'speed',  0.5, 385,800, 1);
  nd('w_n3','Deep Waters', 'hp',      25, 375,940, 1);
  nd('w_n4','Torrent',     'waterDmg',10, 530,700, 1);
  nd('w_n5','Mending',     'regen',    4, 530,800, 1);
  nd('w_n6','Tide Pool',   'hp',       20, 530,900, 1);
  nd('w_ik','Ocean Wrath', 'waterDmg',18, 650,800, 2);
  sat('w_n1',375,660,'waterDmg',4,6,58,Math.PI*1.1);
  sat('w_n2',385,800,'speed',0.2,5,55,Math.PI*0.85);
  sat('w_n3',375,940,'hp',12,6,58,Math.PI*0.9);
  sat('w_n4',530,700,'waterDmg',5,5,52,Math.PI*1.2);
  sat('w_n5',530,800,'regen',2,4,50,Math.PI*0.5);

function getEquipStats(){
  const s={hp:0,strength:0,speed:0,fireDmg:0,waterDmg:0,iceDmg:0,elecDmg:0,defense:0,regen:0,critChance:0,range:0};
  ['helmet','chestplate','leggings','shoes','wand1','wand2'].forEach(k=>{
    const it=getItemDat(player.inventory[k]);
    if(it&&it.stats)Object.entries(it.stats).forEach(([sk,v])=>s[sk]=(s[sk]||0)+v);
  });return s;
}
function getMaxHp(){return player.maxHp+player.stats.hp+getEquipStats().hp;}
function getAttack(){
  const eq=getEquipStats();
  const eDmg={1:player.stats.waterDmg+eq.waterDmg,2:player.stats.fireDmg+eq.fireDmg,
               3:player.stats.elecDmg+eq.elecDmg,4:player.stats.iceDmg+eq.iceDmg}[playerElement]||0;
  return 10+(player.stats.strength+eq.strength)*2+eDmg;
}
function getSpeed(){return 2.5+player.stats.speed+getEquipStats().speed;}
function getGemBaseDmg(gemId){
  const gd=SKILL_GEMS[gemId];if(!gd)return getAttack()*2;
  const eq=getEquipStats();
  const str=(player.stats.strength+eq.strength)*2;
  if(gd.element==='arcane')return Math.round(10+str*3);
  const all={fire:player.stats.fireDmg+eq.fireDmg,water:player.stats.waterDmg+eq.waterDmg,
             ice:player.stats.iceDmg+eq.iceDmg,elec:player.stats.elecDmg+eq.elecDmg};
  const gemElem=all[gd.element]||0;
  const nativeKey={1:'water',2:'fire',3:'elec',4:'ice'}[playerElement];
  const nativeElem=all[nativeKey]||0;
  return Math.round(10+str+Math.max(gemElem,nativeElem*0.4)*1.5);
}
function equipItem(item){
  const it=getItemDat(item);if(!it||!it.slots||!it.slots.length)return;
  const iid=typeof item==='object'?item._id:item;
  const slot=it.slots.find(s=>!player.inventory[s])||it.slots[0];
  const old=player.inventory[slot];if(old)player.inventory.bag.push(old);
  player.inventory[slot]=item;
  const idx=player.inventory.bag.findIndex(x=>(typeof x==='object'?x._id:x)===iid);
  if(idx>=0)player.inventory.bag.splice(idx,1);
}
function unequipSlot(s){
  const it=player.inventory[s];if(!it)return;
  player.inventory.bag.push(it);player.inventory[s]=null;
}

function getActiveGates(){
  if(currentZoneId==='town'){
    const gs=TOWN_ACT_GATES.map(g=>({...g,locked:!isActUnlocked(g.actReq)}));
    if(actBossDefeated[3])gs.push({...MAPS_PORTAL,locked:false});

  if(currentZoneId==='map'){
    return [{wx:32*TS+TS/2,wy:59*TS,label:'Return to Town',color:'#cccccc',vert:false,zone:'town'}];
  }
  const z=CAMPAIGN_BY_ID[currentZoneId];
  if(!z)return [];
  const gates=[];
  const prev=campaignPrev(currentZoneId);
  const next=campaignNext(currentZoneId);
  // Back gate
  if(prev){
    const label=prev==='town'?'Return to Town':(ZONE_CFG[prev]?.name||prev);
    const color=prev==='town'?'#c8c8b0':(ZONE_CFG[prev]?.color||'#aaa');
    if(z.biome==='beach')
      gates.push({wx:4*TS+TS/2,wy:31*TS+TS/2,label,color,vert:true,zone:prev,locked:false});
    else
      gates.push({wx:32*TS+TS/2,wy:5*TS+TS/2,label,color,vert:false,zone:prev,locked:false});
  }
  // Forward gate (locked in boss zone until boss killed)
  if(next){
    const bossLocked=!!(z.boss&&!actBossDefeated[z.act-1]);
    const label=next==='town'?'Return to Town':(ZONE_CFG[next]?.name||next);
    const color=next==='town'?'#c8c8b0':(ZONE_CFG[next]?.color||'#aaa');
    if(z.biome==='beach')
      gates.push({wx:61*TS+TS/2,wy:31*TS+TS/2,label,color,vert:true,zone:next,locked:bossLocked,bossLocked});
    else
      gates.push({wx:32*TS+TS/2,wy:59*TS,label,color,vert:false,zone:next,locked:bossLocked,bossLocked});
  }
  return gates;
}

const transition={phase:'none',timer:0,next:''};// phase: none|out|in

function startTransition(zoneId){
  if(transition.phase!=='none')return;
  transition.phase='out';transition.timer=0;transition.next=zoneId;
  enteredFromZone=currentZoneId; // always track where we came from
}

function loadZone(id){
  buildZoneMap(id);
  rebuildMinimap();
  spawnZoneMonsters(id);
  particles.length=0;
  if(id!=='town'&&id!=='map')zonesVisited.add(id);
  const z=CAMPAIGN_BY_ID[id];
  zoneDropTier=z?.dt||1;
  if(id==='town'){
    // Return near the gate for the act we just came from
    const fromAct=getZoneAct(enteredFromZone)||1;
    const pos=ACT_TOWN_RETURN[fromAct]||TOWN_SPAWN;
    player.wx=pos.wx;player.wy=pos.wy;
  } else if(z){
    const prev=campaignPrev(id);
    const comingFromPrev=(enteredFromZone===prev)||(z.seq===1); // first zone or coming forward
    if(z.biome==='beach'){
      // East-west map: enter west from prev, enter east if backtracking
      if(comingFromPrev){player.wx=BEACH_SPAWN.wx;player.wy=BEACH_SPAWN.wy;}
      else{player.wx=58*TS+TS/2;player.wy=31*TS+TS/2;}
    } else {
      // North-south map: enter north from prev, enter south if backtracking
      if(comingFromPrev){player.wx=32*TS+TS/2;player.wy=8*TS;}
      else{player.wx=32*TS+TS/2;player.wy=57*TS;}
    }
  } else {
    player.wx=32*TS+TS/2;player.wy=8*TS;
  }
  updateCamera();
  currentZoneId=id;
  const cfg=ZONE_CFG[id];
  document.body.style.background=cfg.bg;
  const actNum=getZoneAct(id);
  const actLabel=actNum?` — Act ${actNum}`:'';
  zoneAnnounce={name:cfg.name+actLabel,color:cfg.color,timer:190};
  updateQuests();
}

function updateTransition(){
  if(transition.phase==='none')return;
  transition.timer++;
  if(transition.phase==='out'&&transition.timer>=35){
    loadZone(transition.next);
    transition.phase='in';transition.timer=0;
  }
  if(transition.phase==='in'&&transition.timer>=35){
    transition.phase='none';
  }
}

let invGemSocketRects=[]; // {x,y,w,h,slotKey,socketIdx}
let invUnlockSlotRects=[]; // {x,y,w,h,slotKey}
function handleInvClick(mx,my){
  // Currency mode: click an RNG item to apply currency
  if(currencyMode.active){
    for(const{x,y,w,h,index}of bagItemRects){
      if(mx>=x&&mx<x+w&&my>=y&&my<y+h){
        const target=player.inventory.bag[index];
        if(applyCurrency(currencyMode.currId,target)){
          const ci=player.inventory.bag.findIndex(x2=>x2===currencyMode.currId);
          if(ci>=0)player.inventory.bag.splice(ci,1);
        }
        currencyMode={active:false,currId:null};return;
      }
    }
    for(const{x,y,w,h,slot}of invSlotRects){
      if(mx>=x&&mx<x+w&&my>=y&&my<y+h){
        const target=player.inventory[slot];
        if(applyCurrency(currencyMode.currId,target)){
          const ci=player.inventory.bag.findIndex(x2=>x2===currencyMode.currId);
          if(ci>=0)player.inventory.bag.splice(ci,1);
        }
        currencyMode={active:false,currId:null};return;
      }
    }
    currencyMode={active:false,currId:null};return;
  }
  // Gem socket click: socket a gem from bag into selected slot
  for(const{x,y,w,h,slotKey,socketIdx}of invGemSocketRects){
    if(mx>=x&&mx<x+w&&my>=y&&my<y+h){
      const it=getItemDat(player.inventory[slotKey]);if(!it)return;
      const existing=it.gems[socketIdx];
      if(existing){
        player.inventory.bag.push(existing);it.gems[socketIdx]=null;invSelectedSlot=slotKey;return;
      }
      if(invSelectedSlot&&invSelectedSlot!==slotKey){
        // Try to socket whatever is selected in bag
      }
      invSelectedSlot=slotKey;return;
    }
  }
  // Unlock gem slot button
  for(const{x,y,w,h,slotKey}of invUnlockSlotRects){
    if(mx>=x&&mx<x+w&&my>=y&&my<y+h){unlockGemSlot(slotKey);return;}
  }
  // Bag click
  for(const{x,y,w,h,index}of bagItemRects){
    if(mx>=x&&mx<x+w&&my>=y&&my<y+h){
      const item=player.inventory.bag[index];
      const it=getItemDat(item);if(!it)return;
      if(it.type==='currency'){currencyMode={active:true,currId:item};invSelectedSlot=null;return;}
      if((it.type==='skill_gem'||it.type==='support_gem')&&invSelectedSlot){
        // Socket into selected slot
        const slotIt=getItemDat(player.inventory[invSelectedSlot]);
        if(slotIt&&slotIt.gems){
          const emptyIdx=slotIt.gems.indexOf(null);
          if(emptyIdx>=0){
            slotIt.gems[emptyIdx]=it.gemId;
            player.inventory.bag.splice(index,1);
          }
        }
        invSelectedSlot=null;return;
      }
      if(it.type==='map'){return;} // maps opened via M
      equipItem(item);return;
    }
  }
  // Equipment slot click (select for gem socketing or unequip)
  for(const{x,y,w,h,slot}of invSlotRects){
    if(mx>=x&&mx<x+w&&my>=y&&my<y+h){
      if(invSelectedSlot===slot){invSelectedSlot=null;}
      else{invSelectedSlot=slot;}
      return;
    }
  }
}

// ── Kill monster ───────────────────────────────────────────────────────────
function killMonster(m){
  if(m.dying)return;
  m.dying=true;m.deathTimer=30;
  player.xp+=m.xpReward;player.gold+=m.goldReward;
  if(m.type<killCounts.length)killCounts[m.type]++;
  updateQuests();checkLevelUp();
  if(m.type===5&&currentZoneId!=='map'){
    zoneAnnounce={name:'Guardian Defeated!',color:'#ffe040',timer:200};
  }
  const mt=MTYPE[m.type];
  if(mt.isActBoss){
    actBossDefeated[mt.actNum-1]=true;
    const nextAct=mt.actNum+1;
    let msg=nextAct<=4?`Act ${nextAct} Unlocked!`:'';
    if(mt.actNum===4){
      // Act 4 cleared → the interlude opens; Maps begin.
      player.ascended=true;
      msg='The Interlude opens — Map Portal active in Town!';
    }
    zoneAnnounce={name:`${mt.name} Defeated! ${msg}`,color:'#ffe040',timer:340};
    updateQuests();
  }
  if(currentZoneId==='map'){
    const alive=monsters.filter(x=>!x.dying&&x.state!=='dead');
    if(!alive.length&&!mapCompleteDone){
      mapCompleteDone=true;
      const md=MAP_DEFS[(player.mapTier||1)-1];
      player.gold+=md.reward.gold;player.xp+=md.reward.xp;checkLevelUp();
      zoneAnnounce={name:`Map T${player.mapTier} Complete! +${md.reward.gold}g +${md.reward.xp}xp`,color:'#ffdd44',timer:280};
    }
  }
  if(mt.drops)mt.drops.forEach(d=>{
    if(Math.random()>=d.ch)return;
    if(d.baseType){
      const ri=generateEquip(d.baseType,d.elem?playerElement:null,d.rar||null);
      if(ri)groundDrops.push({wx:m.wx+(Math.random()*28-14),wy:m.wy+(Math.random()*28-14),item:ri,timer:700});
    }else if(d.id){
      groundDrops.push({wx:m.wx+(Math.random()*28-14),wy:m.wy+(Math.random()*28-14),id:d.id,timer:700});
    }
  });
  // Currency drops (small chance)
  if(Math.random()<0.04)groundDrops.push({wx:m.wx,wy:m.wy,id:'orb_of_mage',timer:700});
  if(Math.random()<0.008)groundDrops.push({wx:m.wx,wy:m.wy,id:'control_orb',timer:700});
  // Map fragment drops (ascended only)
  if(player.ascended&&Math.random()<0.09){
    const t=Math.min(20,Math.max(1,Math.ceil(player.level/5)+Math.floor(Math.random()*3)-1));
    const mapId=t>=20?'map_t20':t>=15?'map_t15':t>=10?'map_t10':t>=5?'map_t5':'map_t1';
    groundDrops.push({wx:m.wx,wy:m.wy+18,id:mapId,timer:700});
  }
}

function getSocketedGems(){
  // Returns [{gemId, slotKey, socketIdx}] for all socketed gems across all equipped items
  const out=[];
  ['chestplate','wand1','wand2'].forEach(slotKey=>{
    const it=getItemDat(player.inventory[slotKey]);
    if(!it||!it.gems)return;
    it.gems.forEach((g,i)=>{if(g)out.push({gemId:g,slotKey,socketIdx:i});});
  });
  return out;
}
function getGemMods(gemId){
  // Look for support gems in the same socket group as gemId
  let dmg=1,cd=1,chain=0;
  ['chestplate','wand1','wand2'].forEach(slotKey=>{
    const it=getItemDat(player.inventory[slotKey]);
    if(!it||!it.gems)return;
    const mi=it.gems.indexOf(gemId);if(mi<0)return;
    it.gems.forEach((g,i)=>{
      if(i!==mi&&g&&SUPPORT_MODS[g]){
        const mod=SUPPORT_MODS[g];
        if(mod.dmg)dmg*=mod.dmg;if(mod.cd)cd*=mod.cd;if(mod.chain)chain+=mod.chain;
      }
    });
  });
  return{dmg,cd,chain};
}
function getSlotGemCount(slotKey){
  // Returns max total gem slots that can be unlocked at current level (regardless of item's current gemSlots)
  const it=getItemDat(player.inventory[slotKey]);
  if(!it||!it.gemSlots)return 0;
  if(player.level>=50)return 5;
  if(player.level>=40)return 4;
  if(player.level>=25)return 3;
  return 2; // base: 1 existing + 1 unlockable for free-ish
}
function unlockGemSlot(slotKey){
  const it=getItemDat(player.inventory[slotKey]);
  if(!it||!it.gemSlots)return;
  const maxSlots=getSlotGemCount(slotKey);
  if(it.gemSlots>=maxSlots){zoneAnnounce={name:'Max slots for your level',color:'#888',timer:120};return;}
  const nextSlot=it.gemSlots+1;
  const cost=200*nextSlot;
  if(player.gold<cost){zoneAnnounce={name:`Need ${cost}g to unlock slot ${nextSlot}`,color:'#ff8080',timer:150};return;}
  player.gold-=cost;it.gemSlots=nextSlot;
  if(!it.gems)it.gems=[];
  while(it.gems.length<it.gemSlots)it.gems.push(null);
  zoneAnnounce={name:`Gem slot ${nextSlot} unlocked! (-${cost}g)`,color:'#ffe080',timer:160};
}

    const dx2=tx-player.wx,dy2=ty-player.wy,len=Math.sqrt(dx2*dx2+dy2*dy2)||1;

          monsters.forEach(m2=>{if(m2===src||m2.dying||m2.state==='dead')return;const d2=(m2.wx-src.wx)**2+(m2.wy-src.wy)**2;if(d2<nd2){nd2=d2;next=m2;}});
          if(!next)break;
          next.hp-=baseDmg*0.7;if(next.hp<=0&&!next.dying)killMonster(next);
          projectiles.push({type:'thunder',wx:src.wx,wy:src.wy,tx:next.wx,ty:next.wy,life:18,maxLife:18});
          src=next;

      }

  }else if(gemId==='tidal_wave'){

  }else if(gemId==='flame_nova'){

function updateProjectiles(){
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];p.life--;
    if(p.type==='meteor'){
      if(!p.hit){
        const dx2=p.tx-p.wx,dy2=p.ty-p.wy,d=Math.sqrt(dx2*dx2+dy2*dy2)||1;
        p.wx+=dx2/d*12;p.wy+=dy2/d*12;
        if(d<14){
          p.hit=true;spawnBurst(p.wx,p.wy,p.isIce?'#88ccff':'#ff6600',14);
          const aoe=p.isIce?28:38;
          monsters.forEach(m=>{if(m.dying||m.state==='dead')return;
            if((m.wx-p.wx)**2+(m.wy-p.wy)**2<aoe*aoe){m.hp-=p.dmg;if(m.hp<=0&&!m.dying)killMonster(m);}});
        }
      }
    }else if(p.type==='ice_lance'){
      p.wx+=p.vx;p.wy+=p.vy;
      if(!p.hit){
        for(const m of monsters){
          if(m.dying||m.state==='dead')continue;
          if((m.wx-p.wx)**2+(m.wy-p.wy)**2<(m.r+p.r)**2){
            m.hp-=p.dmg;if(m.hp<=0&&!m.dying)killMonster(m);p.hit=true;p.life=0;break;
          }
        }
      }
    }else if(p.type==='wave'){
      p.r+=(p.maxR-30)/p.maxLife*2.2;
      if(p.dmg>0)monsters.forEach(m=>{if(m.dying||m.state==='dead'||p.hit.has(m))return;
        if((m.wx-p.wx)**2+(m.wy-p.wy)**2<p.r*p.r){m.hp-=p.dmg;if(m.hp<=0&&!m.dying)killMonster(m);p.hit.add(m);}});
    }else if(p.type==='void_orb'){
      let best=null,bestD2=600*600;
      monsters.forEach(m=>{if(m.dying||m.state==='dead')return;
        const d2=(m.wx-p.wx)**2+(m.wy-p.wy)**2;if(d2<bestD2){bestD2=d2;best=m;}});
      if(best){const d=Math.sqrt(bestD2)||1;p.vx=p.vx*0.88+(best.wx-p.wx)/d*5*0.12;p.vy=p.vy*0.88+(best.wy-p.wy)/d*5*0.12;}
      else{p.vx*=0.94;p.vy*=0.94;}
      p.wx+=p.vx;p.wy+=p.vy;
      if(!p.hit){for(const m of monsters){if(m.dying||m.state==='dead')continue;
        if((m.wx-p.wx)**2+(m.wy-p.wy)**2<(m.r+p.r)**2){
          m.hp-=p.dmg;if(m.hp<=0&&!m.dying)killMonster(m);p.hit=true;p.life=0;
          spawnBurst(p.wx,p.wy,'#8800ff',16);break;}}}
    }
    if(p.life<=0||(p.type!=='wave'&&p.type!=='void_orb'&&p.hit===true))projectiles.splice(i,1);
    else if(p.type==='void_orb'&&p.hit)projectiles.splice(i,1);
  }
  Object.keys(player.gemCooldowns).forEach(k=>{if(player.gemCooldowns[k]>0)player.gemCooldowns[k]--;});
}

function applyCurrency(currId,targetItem){
  if(typeof targetItem!=='object')return false;
  if(currId==='orb_of_mage'){
    const rerolled=generateEquip(targetItem.baseType,null,targetItem.rarity);
    if(!rerolled)return false;

// ── Map zone ───────────────────────────────────────────────────────────────
function buildMapZone(tier){
  clearMap(T.LAVA_ROCK);
  const base=tier>10?T.SPARK_GROUND:tier>5?T.LAVA_ROCK:T.GRASS;
  for(let r=3;r<61;r++)for(let c=3;c<61;c++){
    if(Math.max(Math.abs(c-32),Math.abs(r-32))<27)map[r][c]=base;
  }
  // Arena floor
  for(let r=18;r<46;r++)for(let c=18;c<46;c++)map[r][c]=T.COBBLE;
  // Obstacles (only for higher tiers)
  if(tier>5){
    [[24,24],[40,24],[24,40],[40,40],[32,22],[32,42],[22,32],[42,32]].forEach(([cx,cr])=>{
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)
        if(map[cr+dr]&&map[cr+dr][cx+dc]!==undefined)map[cr+dr][cx+dc]=T.ROCK;
    });
  }
  // Clear center for player spawn
  for(let r=29;r<35;r++)for(let c=29;c<35;c++)map[r][c]=T.COBBLE;
}
function spawnMapMonsters(tier){
  const md=MAP_DEFS[Math.min(19,tier-1)];
  const sc=md.monsterScale;
  for(let i=0;i<md.monsterCount;i++){
    let placed=false,tries=0;
    while(!placed&&tries<400){
      tries++;
      const c=19+Math.floor(Math.random()*24),r=19+Math.floor(Math.random()*24);
      if(walkable(c*TS+TS/2,r*TS+TS/2)&&(Math.abs(c-32)>5||Math.abs(r-32)>5)){
        const t=Math.floor(Math.random()*5);const mt=MTYPE[t];
        const m=mkMonster(t,c*TS+TS/2,r*TS+TS/2);
        m.hp=Math.round(mt.hp*sc);m.maxHp=m.hp;m.atk=Math.round(mt.atk*sc);
        m.xpReward=Math.round(mt.xp*sc);m.goldReward=Math.round(mt.gold*sc);
        monsters.push(m);placed=true;
      }
    }
  }
  // Boss - placed in top arena, not center
  const bsc=md.bossScale;const mt=MTYPE[5];
  const boss=mkMonster(5,32*TS+TS/2,22*TS+TS/2);
  boss.hp=Math.round(mt.hp*bsc);boss.maxHp=boss.hp;boss.atk=Math.round(mt.atk*bsc);
  boss.xpReward=Math.round(mt.xp*bsc);boss.goldReward=Math.round(mt.gold*bsc);
  monsters.push(boss);
}
function enterMap(tier){
  if(!player.ascended){zoneAnnounce={name:'Reach level 50 to Ascend!',color:'#ff6060',timer:180};return;}
  const mapId=tier>=20?'map_t20':tier>=15?'map_t15':tier>=10?'map_t10':tier>=5?'map_t5':'map_t1';
  const idx=player.inventory.bag.findIndex(x=>x===mapId);
  if(idx<0){zoneAnnounce={name:'No map fragment!',color:'#ff6060',timer:180};return;}
  player.inventory.bag.splice(idx,1);
  player.mapTier=tier;mapCompleteDone=false;mapOpen=false;
  buildMapZone(tier);rebuildMinimap();monsters.length=0;
  spawnMapMonsters(tier);particles.length=0;
  player.wx=32*TS+TS/2;player.wy=32*TS+TS/2;updateCamera();
  currentZoneId='map';document.body.style.background=ZONE_CFG.map.bg;
  zoneAnnounce={name:`Map Tier ${tier} — Clear all enemies!`,color:'#ffdd44',timer:220};
}

// ── Helpers ────────────────────────────────────────────────────────────────
function tileAt(wx,wy){const c=Math.floor(wx/TS),r=Math.floor(wy/TS);if(c<0||c>=MW||r<0||r>=MH)return T.ROCK;return map[r][c];}
function walkable(wx,wy){return TILE_DEF[tileAt(wx,wy)].w;}
function canMove(cx,cy,hw,hh){return walkable(cx-hw,cy-hh)&&walkable(cx+hw,cy-hh)&&walkable(cx-hw,cy+hh)&&walkable(cx+hw,cy+hh);}
function roundRect(c2,x,y,w,h,r){
  c2.beginPath();c2.moveTo(x+r,y);c2.lineTo(x+w-r,y);c2.arcTo(x+w,y,x+w,y+r,r);
  c2.lineTo(x+w,y+h-r);c2.arcTo(x+w,y+h,x+w-r,y+h,r);c2.lineTo(x+r,y+h);c2.arcTo(x,y+h,x,y+h-r,r);c2.lineTo(x,y+r);c2.arcTo(x,y,x+r,y,r);c2.closePath();
}

// ── Game state ─────────────────────────────────────────────────────────────
function checkLevelUp(){
  while(player.xp>=player.xpToNext&&player.level<100){
    player.level++;player.skillPoints++;player.xpToNext=Math.floor(player.xpToNext*1.5);
    player.maxHp+=10;player.hp=getMaxHp();levelUpTimer=130;
    if(player.level===50&&!player.ascended){
      player.ascended=true;
      zoneAnnounce={name:'ASCENDED! Maps unlocked — press M',color:'#ffdd44',timer:360};
    }
  }
}
function respawn(){
  died=false;player.hp=getMaxHp();
  if(currentZoneId!=='town'){startTransition('town');player.wx=TOWN_SPAWN.wx;player.wy=TOWN_SPAWN.wy;}
  else{player.wx=TOWN_SPAWN.wx;player.wy=TOWN_SPAWN.wy;}
}

// ── Update player ──────────────────────────────────────────────────────────
function updatePlayer(){
  if(died||wakeState!=='playing'||skillTreeOpen||inventoryOpen||shopOpen||questOpen||transition.phase!=='none')return;
  let dx=0,dy=0;const spd=getSpeed();
  if(keys['w']||keys['W']||keys['ArrowUp'])   dy-=spd;
  if(keys['s']||keys['S']||keys['ArrowDown']) dy+=spd;
  if(keys['a']||keys['A']||keys['ArrowLeft']) dx-=spd;
  if(keys['d']||keys['D']||keys['ArrowRight'])dx+=spd;
  if(dx&&dy){dx*=0.707;dy*=0.707;}
  if(dx>0)player.facing='right';else if(dx<0)player.facing='left';
  else if(dy>0)player.facing='down';else if(dy<0)player.facing='up';
  const{hw,hh}=player;
  if(canMove(player.wx+dx,player.wy,hw,hh))player.wx=Math.max(hw,Math.min(WORLD_W-hw,player.wx+dx));
  if(canMove(player.wx,player.wy+dy,hw,hh))player.wy=Math.max(hh,Math.min(WORLD_H-hh,player.wy+dy));

  // Gate proximity check
  const gates=getActiveGates();
  for(const g of gates){
    const dx2=player.wx-g.wx,dy2=player.wy-g.wy;
    if(dx2*dx2+dy2*dy2<22*22){
      if(g.locked){
        if(g.bossLocked){
          const z=CAMPAIGN_BY_ID[currentZoneId];
          lockedMsgText=`Defeat ${MTYPE[z?.boss]?.name||'the boss'} to proceed`;
        } else {
          const actNames={1:'The Water, Failed to Take Shape',2:'Uncontrolled Fire',3:'The Iced Automaton'};
          lockedMsgText=`Defeat ${actNames[g.actReq-1]||'the previous act boss'} to unlock Act ${g.actReq}`;
        }
        lockedMsgTimer=180;
      } else if(g.isMapsPortal){mapOpen=true;break;}
      else{startTransition(g.zone);break;}
    }
  }

  // Ground drop pickup
  for(let i=groundDrops.length-1;i>=0;i--){
    const d=groundDrops[i];d.timer--;
    if(d.timer<=0){groundDrops.splice(i,1);continue;}
    const ddx=player.wx-d.wx,ddy=player.wy-d.wy;
    if(ddx*ddx+ddy*ddy<22*22){
      if(d.item)player.inventory.bag.push(d.item);
      else if(d.id)player.inventory.bag.push(d.id);
      groundDrops.splice(i,1);
    }
  }
  if(lockedMsgTimer>0)lockedMsgTimer--;

  if(attackFlash.timer>0)attackFlash.timer--;
  player.attackTimer--;
  if(player.stats.regen>0){regenTick++;if(regenTick>=60){regenTick=0;player.hp=Math.min(getMaxHp(),player.hp+player.stats.regen);}}
  if(player.attackTimer<=0){
    const atkRange=44+(player.stats.range||0);
    let best=null,bestD2=atkRange*atkRange;
    for(const m of monsters){
      if(m.dying||m.state==='dead')continue;
      const dx2=m.wx-player.wx,dy2=m.wy-player.wy,d2=dx2*dx2+dy2*dy2;
      if(d2<bestD2){bestD2=d2;best=m;}
    }
    if(best){
      let dmg=getAttack();
      const eq=getEquipStats();
      const totalCrit=(player.stats.critChance||0)+(eq.critChance||0);
      if(totalCrit>0&&Math.random()*100<totalCrit){dmg*=2;spawnBurst(best.wx,best.wy,'#ffff60',10);}
      best.hp-=dmg;player.attackTimer=45;
      attackFlash={active:true,wx:best.wx,wy:best.wy,timer:7};
      spawnBurst(best.wx,best.wy,PEL.orb);
      if(best.hp<=0&&!best.dying)killMonster(best);
    }else{player.attackTimer=18;}
  }
  for(const m of monsters){
    if(m.dying||m.state==='dead')continue;
    const dx2=m.wx-player.wx,dy2=m.wy-player.wy;
    if(dx2*dx2+dy2*dy2<(m.r+14)*(m.r+14)){
      m.attackTimer--;
      if(m.attackTimer<=0){const totalDef=(player.stats.defense||0)+(getEquipStats().defense||0);const dmgIn=Math.max(1,m.atk-totalDef);player.hp-=dmgIn;m.attackTimer=90;spawnBurst(player.wx,player.wy,'rgba(255,60,60,0.9)',4);if(player.hp<=0){player.hp=0;died=true;}}
    }
  }
}

function updateMonsters(){
  for(const m of monsters){
    if(m.dying){m.deathTimer--;if(m.deathTimer<=0){m.dying=false;m.state='dead';m.respawnTimer=600;}continue;}
    if(m.state==='dead'){m.respawnTimer--;if(m.respawnTimer<=0&&m.type!==5){m.hp=m.maxHp;m.wx=m.ox;m.wy=m.oy;m.state='wander';m.wanderTimer=60;m.attackTimer=60;}continue;}
    const dx=player.wx-m.wx,dy=player.wy-m.wy,dist2=dx*dx+dy*dy;
    if(dist2<80*80)m.state='chase';
    if(dist2>140*140)m.state='wander';
    if(m.state==='chase'){
      const dist=Math.sqrt(dist2)||1,nx=m.wx+dx/dist*m.spd,ny=m.wy+dy/dist*m.spd;
      if(canMove(nx,m.wy,m.r*0.7,m.r*0.7))m.wx=nx;else m.vx=-m.vx;
      if(canMove(m.wx,ny,m.r*0.7,m.r*0.7))m.wy=ny;else m.vy=-m.vy;
    }else{
      m.wanderTimer--;
      if(m.wanderTimer<=0){const a=Math.random()*Math.PI*2;m.vx=Math.cos(a)*m.spd*0.55;m.vy=Math.sin(a)*m.spd*0.55;m.wanderTimer=80+Math.random()*60|0;}
      const nx=m.wx+m.vx,ny=m.wy+m.vy;
      if(canMove(nx,m.wy,m.r*0.7,m.r*0.7))m.wx=nx;else m.vx=-m.vx;
      if(canMove(m.wx,ny,m.r*0.7,m.r*0.7))m.wy=ny;else m.vy=-m.vy;
    }
    m.wx=Math.max(m.r,Math.min(WORLD_W-m.r,m.wx));m.wy=Math.max(m.r,Math.min(WORLD_H-m.r,m.wy));
  }
}

// ── Render tiles ───────────────────────────────────────────────────────────
const FLOWER_CLR=['#e84040','#f0d020','#cc44e0'];
function renderTiles(){
  const c0=Math.floor(camera.x/TS),c1=Math.min(MW,Math.ceil((camera.x+VW)/TS));
  const r0=Math.floor(camera.y/TS),r1=Math.min(MH,Math.ceil((camera.y+VH)/TS));
  for(let r=r0;r<r1;r++)for(let c=c0;c<c1;c++){
    const tid=map[r][c],sx=c*TS-camera.x|0,sy=r*TS-camera.y|0;
    ctx.fillStyle=TILE_DEF[tid].b;ctx.fillRect(sx,sy,TS+1,TS+1);
    if(tid===T.WATER||tid===T.DEEP_WATER){
      // animated shimmer + wave lines
      const wt=frame*0.045+c*0.42+r*0.28;
      ctx.save();ctx.globalAlpha=0.10+0.08*Math.sin(wt);
      ctx.fillStyle='#aaccff';ctx.fillRect(sx+2,sy+2,TS-4,TS-4);ctx.restore();
      ctx.save();ctx.globalAlpha=0.12+0.07*Math.sin(wt+1.2);
      ctx.strokeStyle='#cce8ff';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx+4,sy+~~(TS*0.33)+Math.sin(wt)*2.5|0);ctx.lineTo(sx+TS-4,sy+~~(TS*0.33)+Math.sin(wt+1)*2.5|0);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx+7,sy+~~(TS*0.66)+Math.sin(wt+2)*2|0);ctx.lineTo(sx+TS-7,sy+~~(TS*0.66)+Math.sin(wt+2.8)*2|0);ctx.stroke();
      ctx.restore();
    }else if(tid===T.TREE){
      // trunk
      ctx.fillStyle='#2c1a08';ctx.fillRect(sx+13,sy+19,6,13);
      // foliage — 3 layers
      ctx.fillStyle='#0c2e10';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2+3,13,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#1d5022';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2-2,9,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2e7030';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2-7,6,0,Math.PI*2);ctx.fill();
      // highlight
      ctx.fillStyle='rgba(110,190,70,0.18)';ctx.beginPath();ctx.arc(sx+TS/2-2,sy+TS/2-8,3,0,Math.PI*2);ctx.fill();
    }else if(tid===T.ROCK){
      ctx.fillStyle='#2e2e2e';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#505050';ctx.beginPath();ctx.arc(sx+TS/2-1,sy+TS/2-2,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(220,220,220,0.15)';ctx.beginPath();ctx.arc(sx+TS/2-3,sy+TS/2-4,3,0,Math.PI*2);ctx.fill();
    }else if(tid===T.ICE_ROCK){
      ctx.fillStyle='#1a3548';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#2a5568';ctx.beginPath();ctx.arc(sx+TS/2-1,sy+TS/2-2,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(160,240,255,0.55)';ctx.beginPath();ctx.arc(sx+TS/2-3,sy+TS/2-4,3.5,0,Math.PI*2);ctx.fill();
    }else if(tid===T.LAVA_ROCK){
      ctx.fillStyle='#281008';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,11,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#401808';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(255,70,0,${0.30+0.20*Math.sin(frame*0.09+c+r)})`;
      ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,4.5,0,Math.PI*2);ctx.fill();
    }else if(tid>=T.FLOWER_R&&tid<=T.FLOWER_P){
      const dr=2.2+Math.sin(frame*0.035+c+r)*0.55;
      // stem
      ctx.strokeStyle='rgba(60,120,30,0.6)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx+TS/2,sy+TS/2+4);ctx.lineTo(sx+TS/2,sy+TS/2+dr+2);ctx.stroke();
      // petals
      const fc=FLOWER_CLR[tid-T.FLOWER_R];
      ctx.fillStyle=fc;ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,dr+1.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(255,255,200,0.6)';ctx.beginPath();ctx.arc(sx+TS/2,sy+TS/2,1.2,0,Math.PI*2);ctx.fill();
    }else if(tid===T.SPARK_GROUND&&frame%3===0&&h1(c+(frame%7),r)<12){
      ctx.fillStyle='rgba(230,220,255,0.9)';ctx.fillRect(sx+h2(c,r)%26,sy+h1(c,r)%26,2,2);
    }else if(tid===T.COBBLE){
      // brickwork pattern (offset rows)
      const rowOff=(r%2)===0?0:TS/2;
      ctx.strokeStyle='rgba(0,0,0,0.20)';ctx.lineWidth=1;
      ctx.strokeRect(sx+1,sy+1,TS-2,TS-2);
      ctx.beginPath();ctx.moveTo(sx,sy+TS/2);ctx.lineTo(sx+TS,sy+TS/2);ctx.stroke();
      const vx=sx+((rowOff+TS/2)%TS);
      ctx.beginPath();ctx.moveTo(vx,sy);ctx.lineTo(vx,sy+TS/2);ctx.stroke();
      // subtle highlight on top-left face
      ctx.fillStyle='rgba(255,255,255,0.04)';ctx.fillRect(sx+2,sy+2,TS-4,TS/2-3);
    }
  }
}

// ── Critical-path guide line ("map line") ──────────────────────────────────
// Returns {points:[{wx,wy}...], color, label, target:{wx,wy}} or null.
function getGuideWaypoints(){
  // Boss zones: glowing trail from entry waypoints to the boss
  const bd=ACT_BOSS_DATA[currentZoneId];
  if(bd){
    if(actBossDefeated[bd.act-1])return null; // boss slain — path complete
    const pts=bd.path.map(([c,r])=>({wx:c*TS+TS/2,wy:r*TS+TS/2}));
    const tgt={wx:bd.bx,wy:bd.by};pts.push(tgt);
    return{points:pts,color:ZONE_CFG[currentZoneId].color,label:MTYPE[bd.mtype].name,target:tgt};
  }
  // Town: point to the next objective gate (next act's boss zone), else Map Portal
  if(currentZoneId==='town'){
    let targetZone=null;
    if(!actBossDefeated[0])targetZone='beach';
    else if(!actBossDefeated[1])targetZone='ember_depths';
    else if(!actBossDefeated[2])targetZone='glacial_core';
    else if(!actBossDefeated[3])targetZone='storm_summit';
    let tgt,color,label;
    if(targetZone){
      const g=GATES.find(x=>x.zone===targetZone);if(!g)return null;
      tgt={wx:g.wx,wy:g.wy};color=g.color;label='Next: '+g.label;
    }else{
      tgt={wx:MAPS_PORTAL.wx,wy:MAPS_PORTAL.wy};color=MAPS_PORTAL.color;label='Map Portal';
    }
    const center={wx:31*TS+TS/2,wy:31*TS+TS/2};
    const mid={wx:(center.wx+tgt.wx)/2,wy:(center.wy+tgt.wy)/2};
    return{points:[center,mid,tgt],color,label,target:tgt};
  }
  return null;
}
function renderGuidePath(){
  if(wakeState!=='playing')return;
  const g=getGuideWaypoints();if(!g)return;
  const pts=g.points.map(p=>({x:p.wx-camera.x,y:p.wy-camera.y}));
  // Animated glowing dashed polyline
  ctx.save();
  ctx.lineCap='round';ctx.lineJoin='round';
  // soft outer glow
  ctx.strokeStyle=g.color;ctx.globalAlpha=0.16;ctx.lineWidth=10;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  // dashed core, marching ants
  ctx.globalAlpha=0.75;ctx.lineWidth=3;
  ctx.setLineDash([14,12]);ctx.lineDashOffset=-(frame*0.6)%26;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  ctx.setLineDash([]);
  // waypoint diamonds
  ctx.globalAlpha=0.85;
  for(let i=0;i<pts.length-1;i++){
    const p=pts[i],pul=0.6+0.4*Math.sin(frame*0.08+i);
    ctx.fillStyle=g.color;
    ctx.beginPath();ctx.moveTo(p.x,p.y-4*pul);ctx.lineTo(p.x+4*pul,p.y);ctx.lineTo(p.x,p.y+4*pul);ctx.lineTo(p.x-4*pul,p.y);ctx.closePath();ctx.fill();
  }
  // target marker — pulsing ring + label
  const t=pts[pts.length-1],pulse=0.5+0.5*Math.sin(frame*0.1);
  ctx.globalAlpha=0.4+0.4*pulse;ctx.strokeStyle=g.color;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(t.x,t.y,14+pulse*6,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=0.9;ctx.fillStyle=g.color;
  ctx.beginPath();ctx.arc(t.x,t.y,4,0,Math.PI*2);ctx.fill();
  if(t.x>-60&&t.x<VW+60&&t.y>-60&&t.y<VH+60){
    ctx.font='bold 10px Arial';ctx.textAlign='center';
    const lw=ctx.measureText(g.label).width+10;
    ctx.globalAlpha=0.8;ctx.fillStyle='rgba(0,0,0,0.7)';
    roundRect(ctx,t.x-lw/2,t.y-38,lw,15,3);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle=g.color;ctx.fillText(g.label,t.x,t.y-27);ctx.textAlign='left';
  }
  ctx.restore();
}

  // ── Tower — circular magical structure, NE corner ─────────────────────────
  {

      const cx=tx+tw/2,cy=ty+th_/2,rx=tw/2,ry=th_/2;

      // outer magic aura glow

// ── Render gates ───────────────────────────────────────────────────────────
function renderGates(){
  const gates=getActiveGates();
  gates.forEach(g=>{
    const locked=g.locked||false;
    const gcol=locked?'#555555':g.color;
    const sx=g.wx-camera.x,sy=g.wy-camera.y;
    if(sx<-80||sx>VW+80||sy<-80||sy>VH+80)return;
    const off=20;
    const[p1x,p1y]=g.vert?[sx,sy-off]:[sx-off,sy];
    const[p2x,p2y]=g.vert?[sx,sy+off]:[sx+off,sy];
    ctx.save();ctx.globalAlpha=0.5+0.25*Math.sin(frame*0.055+g.wx*0.001);
    ctx.strokeStyle=gcol;ctx.lineWidth=8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(p1x,p1y);ctx.lineTo(p2x,p2y);ctx.stroke();
    ctx.restore();
    [[p1x,p1y],[p2x,p2y]].forEach(([px,py])=>{
      ctx.fillStyle='#504455';ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=gcol;ctx.lineWidth=2.5;ctx.stroke();
    });
    const lbl=locked?`🔒 Act ${g.actReq||''}`:g.label;
    const pad=6,th=16;ctx.font='bold 10px Arial';ctx.textAlign='center';
    const tw=ctx.measureText(lbl).width+pad*2;
    const tx=sx-tw/2,ty=sy-(g.vert?off+th+6:th+12);
    ctx.fillStyle='rgba(0,0,0,0.78)';roundRect(ctx,tx,ty,tw,th,3);ctx.fill();
    ctx.strokeStyle=gcol;ctx.lineWidth=1;roundRect(ctx,tx,ty,tw,th,3);ctx.stroke();
    ctx.fillStyle=gcol;ctx.fillText(lbl,sx,ty+th-4);ctx.textAlign='left';
  });
  if(lockedMsgTimer>0){
    const a=Math.min(1,lockedMsgTimer/20);
    ctx.save();ctx.globalAlpha=a;
    ctx.fillStyle='rgba(0,0,0,0.82)';roundRect(ctx,VW/2-200,VH/2-18,400,32,6);ctx.fill();
    ctx.strokeStyle='#cc2020';ctx.lineWidth=1;roundRect(ctx,VW/2-200,VH/2-18,400,32,6);ctx.stroke();
    ctx.fillStyle='#ff7070';ctx.font='bold 13px Arial';ctx.textAlign='center';
    ctx.fillText(lockedMsgText||'Defeat the act boss to unlock this area',VW/2,VH/2+2);
    ctx.textAlign='left';ctx.restore();
  }
}

// ── Render particles ───────────────────────────────────────────────────────
function renderParticles(){
  particles.forEach(p=>{
    const sx=p.wx-camera.x,sy=p.wy-camera.y;
    if(sx<-5||sx>VW+5||sy<-5||sy>VH+5)return;
    ctx.save();ctx.globalAlpha=(p.life/p.maxLife)*0.9;
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy,p.size,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}

// ── Render monsters ────────────────────────────────────────────────────────
function renderMonsters(){
  monsters.forEach(m=>{
    if(m.state==='dead')return;
    const sx=m.wx-camera.x,sy=m.wy-camera.y;
    if(sx<-60||sx>VW+60||sy<-60||sy>VH+60)return;
    const mt=MTYPE[m.type],alpha=m.dying?(m.deathTimer/30):1;
    ctx.save();ctx.globalAlpha=alpha;
    const grd=ctx.createRadialGradient(sx,sy,m.r*0.4,sx,sy,m.r*2.4);
    grd.addColorStop(0,mt.col+'80');grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(sx,sy,m.r*2.4,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
    ctx.beginPath();ctx.arc(sx,sy,m.r,0,Math.PI*2);ctx.fillStyle=mt.col;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.5;ctx.stroke();
    if(m.state==='chase'&&!m.dying){
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(sx-3,sy-3,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+3,sy-3,2.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(sx-3,sy-3,1.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+3,sy-3,1.2,0,Math.PI*2);ctx.fill();
    }
    if(m.type===5&&!m.dying){
      ctx.strokeStyle=`rgba(180,0,0,${0.4+0.3*Math.sin(frame*0.08)})`;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(sx,sy,m.r+8,0,Math.PI*2);ctx.stroke();
      ctx.font='16px Arial';ctx.textAlign='center';ctx.fillStyle='#ffe040';
      ctx.fillText('👑',sx,sy-m.r-12);ctx.textAlign='left';
    }
    const isAB=mt.isActBoss;
    if(isAB&&!m.dying){
      // Pulsing dual-ring aura for act bosses
      const pulse=0.5+0.5*Math.sin(frame*0.06);
      const ringCol=mt.col;
      ctx.strokeStyle=ringCol;ctx.lineWidth=3+pulse*2;ctx.globalAlpha=0.55+pulse*0.3;
      ctx.beginPath();ctx.arc(sx,sy,m.r+10,0,Math.PI*2);ctx.stroke();
      ctx.lineWidth=1.5;ctx.globalAlpha=0.3+pulse*0.2;
      ctx.beginPath();ctx.arc(sx,sy,m.r+20,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=alpha;
      // Boss name label
      ctx.font='bold 11px Arial';ctx.textAlign='center';
      ctx.fillStyle='rgba(0,0,0,0.7)';
      const lw=ctx.measureText(mt.name).width+10;
      roundRect(ctx,sx-lw/2,sy-m.r-32,lw,16,3);ctx.fill();
      ctx.fillStyle=ringCol;ctx.fillText(mt.name,sx,sy-m.r-20);
      ctx.textAlign='left';
    }
    if((m.hp<m.maxHp||m.state==='chase'||m.type===5||isAB)&&!m.dying){
      const bw=m.r*2+8,bh=4,bx=sx-bw/2,by=sy-m.r-(isAB?36:m.type===5?28:12);
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(bx,by,bw,bh);
      const pct=m.hp/m.maxHp;
      ctx.fillStyle=pct>0.5?'#50d030':pct>0.25?'#d0b020':'#d02020';ctx.fillRect(bx,by,bw*pct,bh);
    }
    ctx.restore();
  });
  if(attackFlash.active&&attackFlash.timer>0){
    const sx=player.wx-camera.x,sy=player.wy-camera.y,tx=attackFlash.wx-camera.x,ty=attackFlash.wy-camera.y;
    ctx.save();ctx.globalAlpha=attackFlash.timer/7;ctx.strokeStyle=PEL.orb;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tx,ty);ctx.stroke();ctx.restore();
  }
}

// ── Render NPCs (town only) ────────────────────────────────────────────────
function renderNPCs(){

// ── Render player ──────────────────────────────────────────────────────────
function renderPlayer(){
  if(died)return;
  const sx=player.wx-camera.x,sy=player.wy-camera.y,e=PEL;
  const gh=ctx.createRadialGradient(sx,sy,4,sx,sy,24);
  gh.addColorStop(0,e.glow);gh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(sx,sy,24,0,Math.PI*2);ctx.fillStyle=gh;ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,14,0,Math.PI*2);ctx.fillStyle=e.cloak;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.1)';ctx.lineWidth=1;ctx.stroke();
  const offs={up:[0,-11],down:[0,7],left:[-9,0],right:[9,0]};
  const[hox,hoy]=offs[player.facing];
  ctx.beginPath();ctx.arc(sx+hox,sy+hoy,7,0,Math.PI*2);ctx.fillStyle=e.head;ctx.fill();
  ctx.beginPath();ctx.arc(sx+hox,sy+hoy,4,0,Math.PI*2);ctx.fillStyle=e.hat;ctx.fill();
  const ang={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0}[player.facing];
  const sx2=sx+Math.cos(ang)*20,sy2=sy+Math.sin(ang)*20;
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx2,sy2);ctx.strokeStyle='#9a8060';ctx.lineWidth=3;ctx.stroke();
  const og=ctx.createRadialGradient(sx2,sy2,0,sx2,sy2,6);
  og.addColorStop(0,'#fff');og.addColorStop(0.5,e.head);og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(sx2,sy2,6,0,Math.PI*2);ctx.fillStyle=og;ctx.fill();
}

];

  // Element badge

  const bg2=ctx.createRadialGradient(27,30,2,27,30,10);

  ctx.fillStyle='#fff';ctx.font='10px Arial';ctx.fillText(`HP  ${player.hp}/${maxHp}`,14,67);

  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(10,74,188,8);

  ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.strokeRect(10,74,188,8);
  ctx.fillStyle='#aaa';ctx.font='9px Arial';ctx.fillText(`Lv${player.level}   XP ${player.xp}/${player.xpToNext}`,12,81);

  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(10,86,188,14);
  ctx.fillStyle='#f0c040';ctx.font='bold 10px Arial';ctx.fillText(`Gold: ${player.gold}g`,14,97);

  if(player.skillPoints>0){
    ctx.save();ctx.fillStyle=`rgba(255,215,40,${0.75+0.25*Math.sin(frame*0.12)})`;
    roundRect(ctx,10,104,188,16,4);ctx.fill();

  if(readyQ>0){
    ctx.save();ctx.fillStyle=`rgba(64,192,240,${0.75+0.25*Math.sin(frame*0.1)})`;
    roundRect(ctx,10,player.skillPoints>0?124:104,188,16,4);ctx.fill();
    ctx.fillStyle='#001820';ctx.font='bold 10px Arial';ctx.textAlign='center';

  ctx.fillText('WASD  Tab:skills  I:inv  E:talk  Q:quests  M:maps  Space/1-3:skills  Esc:menu',10,VH-10);
}

// ── Zone announcement ──────────────────────────────────────────────────────
function renderZoneAnnounce(){

// ── Zone transition overlay ────────────────────────────────────────────────
function renderTransition(){
  if(transition.phase==='none')return;

// ── Overlays ───────────────────────────────────────────────────────────────
function renderInventory(){
  invSlotRects=[];bagItemRects=[];invGemSocketRects=[];invUnlockSlotRects=[];
  const pw=740,ph=490,px=(VW-pw)/2,py=(VH-ph)/2;
  ctx.fillStyle='rgba(0,0,0,0.94)';roundRect(ctx,px,py,pw,ph,10);ctx.fill();
  ctx.strokeStyle='#444';ctx.lineWidth=1.5;roundRect(ctx,px,py,pw,ph,10);ctx.stroke();
  ctx.fillStyle='#eee';ctx.font='bold 16px Arial';ctx.textAlign='center';ctx.fillText('INVENTORY',VW/2,py+26);
  ctx.fillStyle='#f0c040';ctx.font='11px Arial';ctx.fillText(`Gold: ${player.gold}g  |  Lv ${player.level}/100${player.ascended?' ✦ASCENDED':''}`,VW/2,py+42);
  ctx.fillStyle='#555';ctx.font='10px Arial';
  ctx.fillText(`ATK:${getAttack()}  SPD:${getSpeed().toFixed(1)}  MaxHP:${getMaxHp()}`,VW/2,py+56);
  ctx.textAlign='left';

  // Currency mode hint
  if(currencyMode.active){
    const currIt=getItemDat(currencyMode.currId);
    ctx.save();ctx.fillStyle='rgba(200,100,255,0.18)';roundRect(ctx,px+8,py+62,pw-16,20,4);ctx.fill();
    ctx.fillStyle='#cc88ff';ctx.font='bold 10px Arial';ctx.textAlign='center';
    ctx.fillText(`${currIt?.icon||''} ${currIt?.name||''} — click item to apply  (Esc to cancel)`,VW/2,py+76);
    ctx.textAlign='left';ctx.restore();
  }

  const sX=px+14,sW=286,sH=34;
  SLOT_DEFS.forEach((sd,i)=>{
    const sy=py+86+i*38,eq=player.inventory[sd.key];
    const isSelected=invSelectedSlot===sd.key;
    ctx.fillStyle=isSelected?'rgba(255,220,80,0.10)':'rgba(255,255,255,0.03)';roundRect(ctx,sX,sy,sW,sH,4);ctx.fill();
    ctx.strokeStyle=isSelected?'#ffe040':eq?'#667':'#2a2a2a';ctx.lineWidth=isSelected?1.5:1;roundRect(ctx,sX,sy,sW,sH,4);ctx.stroke();
    ctx.fillStyle='#444';ctx.font='9px Arial';ctx.fillText(sd.label,sX+5,sy+11);
    if(eq){
      const it=getItemDat(eq);
      if(it){
        const rcol=it.rarity?RARITY_CLR[it.rarity]:'#ddd';
        ctx.fillStyle=rcol;ctx.font='bold 10px Arial';ctx.fillText(`${it.icon} ${it.name}`,sX+6,sy+24);
        if(it.stats){
          ctx.fillStyle='#888';ctx.font='8px Arial';
          const statStr=Object.entries(it.stats).map(([k,v])=>'+'+v+' '+k.replace('Dmg',' Dmg')).join('  ');
          ctx.fillText(statStr.substring(0,52),sX+sW*0.43,sy+24);
        }
        // Gem sockets for this slot
        if(it.gemSlots>0){
          const unlocked=getSlotGemCount(sd.key);
          for(let gi=0;gi<it.gemSlots;gi++){
            const gx=sX+sW+8+gi*22,gy=sy+5;
            const g=it.gems[gi];
            const gDef=g?(SKILL_GEMS[g]||SUPPORT_GEM_DEFS[g]):null;
            const sockCol=gDef?gDef.color:'#1e1e22';
            ctx.fillStyle=sockCol+'44';roundRect(ctx,gx,gy,18,18,3);ctx.fill();
            ctx.strokeStyle=g?sockCol:'#555';ctx.lineWidth=1;roundRect(ctx,gx,gy,18,18,3);ctx.stroke();
            if(gDef){ctx.font='11px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';
              ctx.fillText(gDef.icon,gx+9,gy+13);ctx.textAlign='left';}
            invGemSocketRects.push({x:gx,y:gy,w:18,h:18,slotKey:sd.key,socketIdx:gi});
          }
          // Unlock next slot button
          if(it.gemSlots<5&&it.gemSlots<unlocked){
            const ux=sX+sW+8+it.gemSlots*22,uy=sy+5;
            ctx.fillStyle='rgba(255,220,64,0.12)';roundRect(ctx,ux,uy,18,18,3);ctx.fill();
            ctx.strokeStyle='#ffe040';ctx.lineWidth=1;roundRect(ctx,ux,uy,18,18,3);ctx.stroke();
            ctx.fillStyle='#ffe040';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText('+',ux+9,uy+13);ctx.textAlign='left';
            invUnlockSlotRects.push({x:ux,y:uy,w:18,h:18,slotKey:sd.key});
          }
        }
      }
    }else{ctx.fillStyle='#2a2a2a';ctx.font='italic 9px Arial';ctx.fillText('— empty —',sX+sW/2-22,sy+24);}
    invSlotRects.push({x:sX,y:sy,w:sW,h:sH,slot:sd.key});
  });

  // Gem socket hint
  if(invSelectedSlot){
    const sit=getItemDat(player.inventory[invSelectedSlot]);
    if(sit&&sit.gemSlots){
      ctx.fillStyle='rgba(255,220,80,0.75)';ctx.font='bold 9px Arial';
      ctx.fillText('Click a gem in bag to socket →',sX,py+86+6*38+6);
    }
  }

  // Bag
  const bagHdr=py+86+6*38+18;
  ctx.fillStyle='#777';ctx.font='bold 10px Arial';ctx.fillText('BAG  (click currency then item to use  |  click skill gem with slot selected to socket)',sX,bagHdr);
  const bagY=bagHdr+10,CELL=46;
  player.inventory.bag.forEach((item,i)=>{
    const col=i%7,row=Math.floor(i/7),bx=sX+col*CELL,by=bagY+row*CELL;
    const it=getItemDat(item);
    const rcol=it?.rarity?RARITY_CLR[it.rarity]:'#333';
    const isActiveCurr=currencyMode.active&&item===currencyMode.currId;
    ctx.fillStyle=isActiveCurr?'rgba(200,100,255,0.25)':'rgba(255,255,255,0.05)';
    roundRect(ctx,bx,by,CELL-3,CELL-3,4);ctx.fill();
    ctx.strokeStyle=isActiveCurr?'#cc88ff':rcol;ctx.lineWidth=isActiveCurr?2:1;roundRect(ctx,bx,by,CELL-3,CELL-3,4);ctx.stroke();
    if(it){
      ctx.font='18px Arial';ctx.textAlign='center';ctx.fillText(it.icon,bx+(CELL-3)/2,by+22);
      ctx.font='6px Arial';ctx.fillStyle=it.rarity?RARITY_CLR[it.rarity]:'#888';

function renderSkillTree(){
  ctx.fillStyle='#070708';ctx.fillRect(0,0,VW,VH);
  // Header (screen space)
  ctx.fillStyle='#ccc';ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.fillText('SKILL TREE',VW/2,26);
  ctx.font='11px Arial';ctx.fillStyle=player.skillPoints>0?'#ffe040':'#444';
  ctx.fillText(player.skillPoints>0?`${player.skillPoints} skill point${player.skillPoints>1?'s':''}  —  click a glowing node`:'No skill points — defeat monsters to level up',VW/2,44);
  ctx.textAlign='left';

  const tz=stView.zoom,tx2=VW/2-stView.x*tz,ty2=VH/2-stView.y*tz;
  ctx.save();ctx.translate(tx2,ty2);ctx.scale(tz,tz);

  // Edges
  const nodeMap={};stNodes.forEach(n=>{nodeMap[n.id]=n;});
  ST_EDGES.forEach(([a,b])=>{
    const na=nodeMap[a],nb=nodeMap[b];if(!na||!nb)return;
    const both=na.unlocked&&nb.unlocked;
    ctx.beginPath();ctx.moveTo(na.x,na.y);ctx.lineTo(nb.x,nb.y);
    ctx.strokeStyle=both?'rgba(220,175,85,0.85)':'rgba(160,120,55,0.28)';
    ctx.lineWidth=both?2/tz:1/tz;ctx.stroke();
  });

  // Hover (in virtual coords)
  const{vx:mvx,vy:mvy}=stStoV(mouseX,mouseY);
  const TIER_R=[6,13,20],TIER_HIT=[10,16,24];
  let hovered=null;
  stNodes.forEach(n=>{const r=TIER_HIT[n.tier],dx=mvx-n.x,dy=mvy-n.y;if(dx*dx+dy*dy<r*r)hovered=n;});

  // Nodes
  stNodes.forEach(n=>{
    const col=STAT_CLR[n.stat]||'#aaa',nr=TIER_R[n.tier],isH=n===hovered;
    // Keystone outer rings
    if(n.tier===2){
      const pulse=n.available&&!n.unlocked?0.45+0.45*Math.sin(frame*0.09):0.6;
      ctx.save();ctx.globalAlpha=pulse;
      ctx.beginPath();ctx.arc(n.x,n.y,nr+12,0,Math.PI*2);ctx.strokeStyle=col+'55';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(n.x,n.y,nr+7, 0,Math.PI*2);ctx.strokeStyle=col+'88';ctx.lineWidth=1.5;ctx.stroke();
      ctx.restore();
    }
    if(n.unlocked){
      const g=ctx.createRadialGradient(n.x,n.y,1,n.x,n.y,nr);
      g.addColorStop(0,'#fff');g.addColorStop(0.5,col);g.addColorStop(1,col+'88');
      ctx.beginPath();ctx.arc(n.x,n.y,nr,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=n.tier>0?1.5:1;ctx.stroke();
    }else if(n.available){
      ctx.beginPath();ctx.arc(n.x,n.y,nr,0,Math.PI*2);ctx.fillStyle=col+'28';ctx.fill();
      if(player.skillPoints>0){
        ctx.save();ctx.globalAlpha=0.5+0.45*Math.sin(frame*0.1);
        ctx.strokeStyle=col;ctx.lineWidth=n.tier>0?2:1.5;ctx.stroke();ctx.restore();
      }else{ctx.setLineDash([3,3]);ctx.strokeStyle=col+'66';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);}
    }else{
      ctx.beginPath();ctx.arc(n.x,n.y,nr,0,Math.PI*2);
      ctx.fillStyle=n.tier===2?'#1c1c22':n.tier===1?'#141418':'#0e0e10';ctx.fill();
      ctx.strokeStyle=n.tier>0?'#282830':'#1a1a1e';ctx.lineWidth=1;ctx.stroke();
    }
    if(isH){ctx.beginPath();ctx.arc(n.x,n.y,nr+4,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.45)';ctx.lineWidth=1.5;ctx.stroke();}
    // Labels
    if(n.tier>0||isH){
      const fs=n.tier===2?11:n.tier===1?9:8;
      ctx.font=n.unlocked?`bold ${fs}px Arial`:`${fs}px Arial`;ctx.textAlign='center';
      ctx.fillStyle=n.unlocked?'#eee':n.available?col:'#333';
      ctx.fillText(n.lbl,n.x,n.y+nr+fs+3);ctx.textAlign='left';
    }
  });

  ctx.restore();

  // Tooltip (screen space)
  if(hovered){
    const n=hovered;
    const SF={iceDmg:'ice dmg',elecDmg:'elec dmg',waterDmg:'water dmg',fireDmg:'fire dmg',
              strength:'strength',speed:'speed',hp:'max HP',defense:'defense',
              regen:'regen/s',critChance:'crit%',range:'range'};
    const tip=`${n.lbl}  +${n.val} ${SF[n.stat]||n.stat}`;
    ctx.font='11px Arial';const tw=ctx.measureText(tip).width+16;
    let tipX=mouseX-tw/2,tipY=mouseY-36;
    tipX=Math.max(4,Math.min(VW-tw-4,tipX));tipY=Math.max(50,tipY);
    ctx.fillStyle='rgba(8,8,14,0.96)';roundRect(ctx,tipX,tipY,tw,20,4);ctx.fill();
    ctx.strokeStyle=STAT_CLR[n.stat]||'#666';ctx.lineWidth=1;roundRect(ctx,tipX,tipY,tw,20,4);ctx.stroke();
    ctx.fillStyle='#ddd';ctx.textAlign='center';ctx.fillText(tip,tipX+tw/2,tipY+14);ctx.textAlign='left';
  }

  ctx.fillStyle='rgba(70,70,70,0.8)';ctx.font='10px Arial';ctx.textAlign='center';
  ctx.fillText('Tab/Esc — close   Scroll — zoom   Drag — pan',VW/2,VH-8);ctx.textAlign='left';
}

function renderProjectiles(){
  projectiles.forEach(p=>{
    const sx=p.wx-camera.x,sy=p.wy-camera.y;
    if(p.type==='meteor'&&!p.hit){
      const core=p.isIce?'#88ccff':  '#ff8800';
      const mid= p.isIce?'#aaeeff':  '#ff7700';
      const out= p.isIce?'rgba(100,180,255,0)':'rgba(180,30,0,0)';
      const trailC=p.isIce?'#88ccff':'#ff5500';
      const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,p.isIce?16:20);
      g2.addColorStop(0,'#ffffff');g2.addColorStop(0.4,mid);g2.addColorStop(1,out);
      ctx.beginPath();ctx.arc(sx,sy,p.isIce?16:20,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
      ctx.beginPath();ctx.arc(sx,sy,p.isIce?7:9,0,Math.PI*2);ctx.fillStyle=core;ctx.fill();
      ctx.save();ctx.globalAlpha=0.4;ctx.strokeStyle=trailC;ctx.lineWidth=p.isIce?3:4;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-4,sy-16);ctx.stroke();ctx.restore();
    }else if(p.type==='ice_lance'){
      const lc=p.color||'#aaeeff';const oc=p.color||'#7adcf5';
      ctx.save();
      ctx.strokeStyle=lc;ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-p.vx*4,sy-p.vy*4);ctx.stroke();
      const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,p.r+4);
      g2.addColorStop(0,'#ffffff');g2.addColorStop(1,oc);
      ctx.beginPath();ctx.arc(sx,sy,p.r+4,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
      ctx.restore();
    }else if(p.type==='thunder'){
      const tx=p.tx-camera.x,ty=p.ty-camera.y;
      ctx.save();ctx.globalAlpha=p.life/p.maxLife;
      ctx.strokeStyle='#ddaaff';ctx.lineWidth=3;ctx.shadowBlur=14;ctx.shadowColor='#b06aff';
      ctx.beginPath();ctx.moveTo(sx,sy);
      const steps=5,ddx=(tx-sx)/steps,ddy=(ty-sy)/steps;
      for(let j=1;j<steps;j++)ctx.lineTo(sx+ddx*j+(Math.random()-0.5)*18,sy+ddy*j+(Math.random()-0.5)*18);
      ctx.lineTo(tx,ty);ctx.stroke();ctx.restore();
    }else if(p.type==='wave'){
      const wx2=p.wx-camera.x,wy2=p.wy-camera.y;
      const wc=p.color||'#70c1f2';
      const wc2=p.color?p.color+'40':'rgba(180,240,255,0.25)';
      ctx.save();ctx.globalAlpha=(p.life/p.maxLife)*0.75;
      ctx.strokeStyle=wc;ctx.lineWidth=5;
      ctx.beginPath();ctx.arc(wx2,wy2,p.r,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=wc2;ctx.lineWidth=14;
      ctx.beginPath();ctx.arc(wx2,wy2,p.r,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }else if(p.type==='void_orb'){
      ctx.save();
      const ag=Math.min(1,p.life/30);
      ctx.globalAlpha=ag;
      const g2=ctx.createRadialGradient(sx,sy,0,sx,sy,p.r+8);
      g2.addColorStop(0,'#cc88ff');g2.addColorStop(0.5,'#8800ff');g2.addColorStop(1,'rgba(80,0,160,0)');
      ctx.beginPath();ctx.arc(sx,sy,p.r+8,0,Math.PI*2);ctx.fillStyle=g2;ctx.fill();
      ctx.beginPath();ctx.arc(sx,sy,p.r,0,Math.PI*2);ctx.fillStyle='#220044';ctx.fill();
      ctx.strokeStyle='#aa44ff';ctx.lineWidth=2;ctx.stroke();
      // Spiral trail particles
      ctx.globalAlpha=ag*0.5;ctx.strokeStyle='#aa44ff';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx-p.vx*6,sy-p.vy*6);ctx.stroke();
      ctx.restore();
    }
  });
}

// ── Wake-up / barrel sequence ──────────────────────────────────────────────
function updateWake(){
  if(wakeState==='sleeping')return;
  if(wakeState==='waking'){
    wakeTimer++;
    barrelObjs.forEach(b=>{
      if(b.landed)return;
      b.wx+=b.vx;
      if(b.wx>=16*TS){b.wx=16*TS+(b===barrelObjs[0]?0:TS);b.landed=true;}
    });
    if(barrelObjs.every(b=>b.landed)&&wakeTimer>60){
      const sw={1:'tide_staff',2:'fire_wand',3:'thunder_rod',4:'ice_wand'}[playerElement];
      const sg={1:'water_gem', 2:'fire_gem',  3:'elec_gem',   4:'ice_gem' }[playerElement];
      equipItem(sw);equipItem(sg);
      wakeMessage=`✦ ${ITEMS[sw].name} & ${ITEMS[sg].name} equipped — Use WASD to move!`;
      wakeMessageTimer=280;wakeLandTimer=70;wakeState='playing';
    }
  }
  if(wakeMessageTimer>0)wakeMessageTimer--;
  if(wakeLandTimer>0)wakeLandTimer--;
}

function renderDrops(){
  groundDrops.forEach(d=>{
    const sx=d.wx-camera.x,sy=d.wy-camera.y;
    if(sx<-24||sx>VW+24||sy<-24||sy>VH+24)return;
    const it=d.item?d.item:getItemDat(d.id);
    const glowClr=it&&it.rarity?{magic:'rgba(100,120,255,0.4)',rare:'rgba(255,220,40,0.4)'}[it.rarity]||'rgba(255,255,180,0.35)':'rgba(255,255,180,0.35)';
    const grd=ctx.createRadialGradient(sx,sy,0,sx,sy,18);
    grd.addColorStop(0,glowClr);grd.addColorStop(1,'rgba(0,0,0,0)');
    ctx.beginPath();ctx.arc(sx,sy,18,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
    ctx.save();ctx.globalAlpha=0.65+0.3*Math.sin(frame*0.12);
    ctx.font='16px Arial';ctx.textAlign='center';
    ctx.fillText(it?it.icon:'?',sx,sy+6);ctx.textAlign='left';ctx.restore();
  });
}

function renderWake(){
  if(wakeState==='playing'){
    // Fade-out barrels + awakening flash while wakeLandTimer counts down
    if(wakeLandTimer>0){
      const bf=wakeLandTimer/70;
      barrelObjs.forEach(b=>{
        const sx=b.wx-camera.x,sy=b.wy-camera.y;
        ctx.save();ctx.globalAlpha=bf;
        ctx.fillStyle='#8B6914';ctx.fillRect(sx-10,sy-14,20,28);
        ctx.strokeStyle='#5a4010';ctx.lineWidth=2;ctx.strokeRect(sx-10,sy-14,20,28);
        ctx.strokeStyle='#3a2808';ctx.lineWidth=3;
        ctx.beginPath();ctx.moveTo(sx-12,sy-5);ctx.lineTo(sx+12,sy-5);ctx.stroke();
        ctx.beginPath();ctx.moveTo(sx-12,sy+5);ctx.lineTo(sx+12,sy+5);ctx.stroke();
        ctx.restore();
      });
      // Awakening ring flash centered on player
      const px=player.wx-camera.x,py=player.wy-camera.y;
      const ringR=16+(1-bf)*60;
      ctx.save();ctx.globalAlpha=bf*0.8;
      ctx.strokeStyle=PEL.orb;ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(px,py,ringR,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=bf*0.35;ctx.strokeStyle='#fff';ctx.lineWidth=6;
      ctx.beginPath();ctx.arc(px,py,ringR*0.65,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    if(wakeMessageTimer>0){
      const a=Math.min(1,wakeMessageTimer/30)*Math.min(1,(280-wakeMessageTimer)/10+0.1);
      ctx.save();ctx.globalAlpha=a;ctx.font='bold 15px "Rajdhani",Arial';
      const tw=ctx.measureText(wakeMessage).width+40;
      ctx.fillStyle='rgba(0,0,0,0.88)';roundRect(ctx,(VW-tw)/2,VH-106,tw,38,8);ctx.fill();
      ctx.strokeStyle=PEL.orb;ctx.lineWidth=1.5;roundRect(ctx,(VW-tw)/2,VH-106,tw,38,8);ctx.stroke();
      ctx.fillStyle='#ffe080';ctx.textAlign='center';ctx.fillText(wakeMessage,VW/2,VH-82);
      ctx.textAlign='left';ctx.restore();
    }
    // When animations complete, re-render player so they're not hidden
    if(wakeLandTimer<=0&&wakeMessageTimer<=0){
      renderPlayer();
    }
    return;
  }
  if(wakeState==='sleeping'){
    ctx.fillStyle='rgba(0,0,0,0.96)';ctx.fillRect(0,0,VW,VH);
    // title glow
    ctx.save();ctx.shadowColor='rgba(90,160,220,0.7)';ctx.shadowBlur=18;
    ctx.fillStyle='#8ab4d8';ctx.font='bold 30px "Cinzel",serif';ctx.textAlign='center';
    ctx.fillText('You are washed ashore...',VW/2,VH/2-40);ctx.restore();
    ctx.font='16px "Rajdhani",Arial';ctx.fillStyle='#cccccc';ctx.textAlign='center';
    ctx.fillText(`${playerName}  —  ${PEL.name} Mage`,VW/2,VH/2+2);
    ctx.save();ctx.globalAlpha=0.5+0.5*Math.sin(frame*0.07);
    ctx.fillStyle='#aaaaaa';ctx.font='13px "Rajdhani",Arial';
    ctx.fillText('Press any key to wake up',VW/2,VH/2+44);
    ctx.restore();ctx.textAlign='left';return;
  }
  // waking: fade overlay out while barrels float in
  const fadeA=Math.max(0,0.94-(wakeTimer/25));
  if(fadeA>0){ctx.save();ctx.globalAlpha=fadeA;ctx.fillStyle='rgba(0,0,0,0.94)';ctx.fillRect(0,0,VW,VH);ctx.restore();}
  // Player spotlight so they are easy to spot on the sand
  const spx=player.wx-camera.x,spy=player.wy-camera.y;
  const sg2=ctx.createRadialGradient(spx,spy,0,spx,spy,48);
  sg2.addColorStop(0,`rgba(255,255,200,${0.55*(1-fadeA)})`);sg2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(spx,spy,48,0,Math.PI*2);ctx.fillStyle=sg2;ctx.fill();
  barrelObjs.forEach(b=>{
    const sx=b.wx-camera.x,sy=b.wy-camera.y;
    if(sx<-40||sx>VW+40)return;
    ctx.fillStyle='#8B6914';ctx.fillRect(sx-10,sy-14,20,28);
    ctx.strokeStyle='#5a4010';ctx.lineWidth=2;ctx.strokeRect(sx-10,sy-14,20,28);
    ctx.strokeStyle='#3a2808';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(sx-12,sy-5);ctx.lineTo(sx+12,sy-5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sx-12,sy+5);ctx.lineTo(sx+12,sy+5);ctx.stroke();
  });
}

// ── Init ───────────────────────────────────────────────────────────────────
currentZoneId='beach';
buildZoneMap('beach');
rebuildMinimap();
spawnZoneMonsters('beach');
document.body.style.background=ZONE_CFG['beach'].bg;
player.wx=BEACH_SPAWN.wx;player.wy=BEACH_SPAWN.wy;
updateCamera();

// ── Main loop ──────────────────────────────────────────────────────────────
let frame=0;
function loop(){
  frame++;
  const anyOpen=skillTreeOpen||inventoryOpen||shopOpen||questOpen||mapOpen;
  if(!anyOpen&&transition.phase==='none'){
    updatePlayer();updateMonsters();updateParticles();spawnZoneParticles();updateCamera();updateSubZone();
    updateProjectiles();
  }
  updateTransition();
  updateWake();
  renderTiles();
  renderAtmosphere();
  renderBuildings();
  renderGuidePath();
  renderGates();
  renderParticles();
  renderMonsters();
  renderDrops();
  renderNPCs();
  renderProjectiles();
  renderPlayer();
  renderHUD();
  renderSkillBar();
  renderZoneAnnounce();
  renderTransition();
  if(skillTreeOpen)renderSkillTree();
  if(inventoryOpen)renderInventory();
  if(shopOpen)renderShop();
  if(questOpen)renderQuestLog();
  if(mapOpen)renderMapMenu();
  if(died)renderDied();
  renderWake();
  requestAnimationFrame(loop);
}
loop();
</script>
